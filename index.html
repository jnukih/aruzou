<style>
  /* ===================================================================
     あるぞう Phase 1〜4 (v0.8.1)
     v0.8.1: ショートカット連携がSafariのタブ再利用時に動かない不具合を修正。同じURLのタブが
     使い回されるとページが再読み込みされず起動時のハッシュチェックが走らないため、
     hashchangeイベントでもapplyReceiptShortcut()を実行するようにした。
     冷蔵庫・日用品・リュクサク(ペット)用品の在庫を絵文字で管理するPWA。
     v0.8.0: レシートパーサ(parseReceipt)を全面書き直し。junの実機で「大根」「こくうまキムチ」等が
       取り込み漏れした件の原因調査で、Live Textの行順が写真によって崩れる(金額が商品名より先に
       来る・商品コードだけの行が挟まる等)ため、旧方式の「商品名の行→直後の金額行」という
       順序依存の逐次ペアリングが破綻することが判明。分類(ノイズ/数量注記/確定金額行/曖昧な数字行/
       商品名)→FIFO突き合わせ、の2段方式に書き直し、行順が入れ替わっても・コード単独行が
       混ざっても正しく対応付くようにした(isReceiptNoiseLine・RECEIPT_AMBIGUOUS_RE等を新設)。
     ・ショートカット連携: 起動時にlocation.hashが「#receipt=」で始まっていたら、レシート取り込み
       シートを自動オープン→貼り付け→「よみとるぞう」まで自動実行し、候補リスト表示まで進める
       (applyReceiptShortcut。iOSショートカットで撮影→テキスト認識→このURLを開く、を想定)。
       クエリではなくハッシュを使うのは、サーバーへ送信されずログにレシート内容が残らないため。
     v0.7.1: 買い物リストが空のときの🐘をchar-worried.png(こまり顔)からchar-thinking.png
       (考えてる顔、鼻を顎に当てて斜め上を見て思案するポーズ)に差し替え。他の空状態(在庫タブ・
       マイ料理一覧・材料ピッカー・レシート候補なし)はこまり顔のまま。emptyStateHtml(msg, img)に
       画像を指定できる第2引数を追加(省略時は従来どおりchar-worried.png、既存呼び出しは無変更)。
     ・配布確認用に APP_VERSION 定数(冒頭の定数群)を新設し、設定シート(⚙️ 設定(iPhone同期))
       最下部に「あるぞう v0.7.1」を小さいグレー文字で表示(通常の操作画面には出さない)。
       Service Workerのキャッシュ名はSW側との非同期メッセージ通信が必要で実装が重くなるため、
       今回は表示を見送った(バージョン表示のみ)。
     v0.7.0: キャラクター画像(象)を導入し、絵文字🐘の一部を専用イラストに置き換え。
     ・ホーム画面アイコンを icon-180-v3.png / icon-512-v3.png に更新(iOSがアイコンを
       再取得しないことがあるためファイル名を変更。manifest.webmanifestにも512pxエントリを追加)。
     ・空状態(在庫0/買い物リスト空/マイ料理なし)の🐘 → char-worried.png(こまり顔、高さ140px)。
     ・完了トースト(レシート取り込み確定・マイ料理の一括消費・手動同期「そろえたぞう」)に
       char-joy.png(よろこび、高さ22px)を小さく添える。個別の1個消費トーストには付けない
       (「やりすぎない」方針、毎回出る操作には出さない)。
     ・ヘッダータイトル横の🐘 → char-normal.png(通常の立ち姿、高さ26px)。長押しで設定シートを
       開く隠し入口の当たり判定はimg要素にそのまま引き継ぐ。
     ・画像はすべて<img>参照(data URI埋め込みはしない。index.htmlの肥大化を避けるため)。
     v0.6.0: Phase 4「マイ料理」を追加。よく作る料理をレシピ(S.data.recipes、材料は名前で保持)として
     登録しておき、「作った」1操作で材料を一括消費できる。レシート取り込み(候補を確認して足す)と
     対になる「消費=候補を確認して引く」機能で、必ず確認画面を挟む。
     ・冷蔵庫タブ上部に「🍳 マイ料理」ボタンを新設(買い物リストの「🧾レシート取り込み」と対称の位置づけ)。
       レシピ一覧→登録/編集(名前・絵文字・材料。材料は在庫/よく買うものから選ぶか手入力、
       個数ものは数量・残量ものは「使う」フラグのみ)→タップで「作った」確認画面、の3ビューを
       1つのシート(S.recipeView: list|edit|cook)内で切り替える。
     ・確認画面(核心)は材料ごとに現在の実在庫(cat:"fridge"限定、findFridgeItemByName)と突き合わせ、
       個数ものは「足りる/在庫◯個です◯個だけ消費(自動で切り下げ)/在庫にありません(スキップ)」を判定し
       消費数ステッパー+行ごとのON/OFFを提供、残量ものは「そのまま/1段階減った/使い切った」の3択(既定
       そのまま)を提供する。★在庫はマイナスにしない(消費数は在庫数を上限にクランプ)のが絶対条件。
       確定(つかったぞう)前に pushUndo() を1回だけ呼び、個数0到達時は consumeItem 同様に
       tombstone化+addToShoppingIfNotExists、残量は tapGauge のルール(1以下で買い物リストへ自動追加)
       と整合させる。全材料がスキップ(操作対象なし)なら確定ボタンを無効化する。
     ・EMOJI_GROUPSに「料理」グループを追加(🍛🍜🍚🥘等、レシピの絵文字ピッカー用)。
     ・同期: recipesシートに対応(サーバー側は既存)。ingredientsは1セルに入れるため送信時に
       JSON.stringify、受信時にJSON.parseして配列へ戻す(recipesForSync/applyRecipesToLocal)。
       他のレコードと同じくmergeRemoteRecords()でupdatedAt比較マージ。json.recipesが無い
       (古いサーバー)場合もmergeRemoteRecordsが空配列として扱うため落ちない。
     v0.5.1: 🐛同期の重大バグ修正「消費してもすぐ元に戻る」。原因は2つで、
     (1) runSync が同期中の要求を `if (SYNC.syncing) return;` で捨てていたため、POSTの往復中
         (数秒)に行った操作がサーバーへ永久に届かなかった → SYNC.pendingSync に覚えて
         完了後に flushPendingSync() で必ず送り直す。
     (2) applySyncResult がサーバーの応答で items/shopping/dicts を丸ごと置き換えていたため、
         往復中のローカル変更が消えた → mergeRemoteRecords() でレコード単位に
         updatedAt の新しい方を残し、サーバーにまだ無いローカル分も落とさないようにした。
     v0.5.0: Phase 2「GAS同期」のクライアント側を実装。junとしおりの2台のiPhoneで在庫を
     共有するための任意機能(未設定なら従来どおり完全ローカル動作)。
     ・items/shoppingの各レコードに updatedAt(数値ms)・deleted(真偽値)を追加。migrateSyncFields()
       で既存データへ1回きり付与。favoritesの各エントリにも同様に付与(よく買うものの削除にも
       tombstone方式を使うため)。
     ・削除は物理削除(splice)ではなく tombstone方式(deleted:true + updatedAt更新)に変更。
       他端末の同期で削除済みアイテムが復活する「ゾンビ」を防ぐ。対象: アイテム削除・個数0での
       自動削除・買い物リストのチェック済み一括削除・買い物リスト個別削除・よく買うものの削除。
       描画・集計・検索側では findItem()/activeFavorites()、各filterで deleted を必ず除外する。
     ・設定シートを新設(ヘッダーの🐘長押し、または買い物リスト下部の「⚙️ 設定」から開く)。
       GAS Web App URLと合言葉はコード直書きせず localStorage(aruzou-sync-v1)に保存する。
       接続テスト(GET)・今すぐ同期(POST)・同期ON/OFFを提供。
     ・同期はpull+pushを1回のPOSTで行う方式(サーバーがマージして返した全データでローカルを
       置き換える。マージロジックはクライアント側に持たない)。persist()にsyncのデバウンス
       予約(3秒)を仕込み、あらゆるデータ変更後に自動発火する。起動時・visibilitychangeでの
       フォアグラウンド復帰時・設定シートの「今すぐ同期」でも実行する。オフライン/失敗時は
       ローカル動作を継続しエラーで操作をブロックしない(次回再送)。同期中フラグで多重実行を防止。
     ・dict(食材学習辞書)/receiptDict(レシート学習辞書)/favorites(よく買うもの)は
       dictsFromLocal()/applyDictsToLocal()でサーバーの dicts配列(kind:"food"|"receipt"|"fav" +
       key)形式と相互変換する。favoritesはid管理していないため key = "<cat>|<name>" で一意化する。
     v0.4.3: 残量もの2列グリッドの右列がセクション枠からはみ出す不具合を修正。原因はgridの1frの下限が
     中身の最小幅(min-content)になるため、長い名前(例:塩こんぶ超徳用袋)がセルを押し広げていたこと。
     grid-template-columnsをminmax(0,1fr)にし、セルとitem-head/item-nameにmin-width:0+省略記号を追加。
     .gauge-rowの既定width:100%も2列セル内ではwidth:autoに戻す。あわせてゲージドットを詰めて(15px/
     letter-spacing2.5px)名前の表示幅を確保(タップ領域はmin-height:40pxで維持)。
     v0.4.2: カスタム絵文字を3種追加(:shoyu:醤油/:sugar:砂糖/:cabbage:キャベツ)。Codex生成画像を
     chroma.swiftで透過化・128pxに縮小してCUSTOM_EMOJIへ追加、LEGACY_EMOJI_MIGRATIONSで旧Unicode絵文字
     (🍶🍬🥬)からの移行に対応。キャベツは黄緑〜緑の被写体が背景の純緑に近く通常のクロマキーだと
     葉まで抜けてしまったため、画像の四隅から連結した緑領域のみをフラッドフィルで透過する専用スクリプト
     (chroma_cabbage.swift)で処理(被写体本体は🥬の汎用「葉物野菜」名として引き続き併存)。
     v0.4.1: 在庫表示をコンパクト化。個数もの(count)は名前+絵文字列を縦2段→横1段にまとめ、
     名前ブロックは可変幅+省略記号で必要な分だけ絵文字列に幅を譲る(item-cardをflex行に変更)。
     残量もの(gauge)は部門セクション内で個数ものの後にまとめ、2列グリッド(.gauge-grid)で
     「リード絵文字+名前+ゲージドット」を1行に収めて表示(ラベル文字は幅が厳しいため2列時は省略、
     タップで1段階減る挙動と44pxのタップ領域は維持)。emoji-tapは29px→27pxに微調整。
     冷蔵庫タブに「調味料」部門を追加(DEPTS.fridge/FRIDGE_DEPT_DECOR/PRESETS.fridge/FOOD_DICTを更新)。
     既存データの移行として、fridgeカテゴリで調味料名または調味料絵文字グループに該当するアイテムの
     deptを"調味料"へ書き換える1回きりの処理を追加(d.migrations.condimentDeptで再実行を防止)。
     v0.4.0: Phase 3「レシート取り込み」機能を追加。写真アプリのLive Text(長押し→テキスト選択→コピー)で
     得たレシートの生テキストを貼り付けると、parseReceipt()が商品行/金額行/数量注記(@139✕2個等)/割引・
     レジ袋・合計以降を判別して商品候補を抽出し、guessItemFor()が学習辞書(receiptDict、レーベンシュタイン
     あいまい一致対応)→既存在庫→内蔵食材辞書(FOOD_DICT)の順で在庫アイテムを推定する。買い物リストタブに
     「🧾レシート取り込み」ボタンを新設、候補ごとにON/OFF・名前・絵文字・タイプ・部門を編集して確定すると
     在庫へ加算(個数は加算・残量はたっぷりに)、買い物リストの同名は消し込み、選択内容をreceiptDictへ学習する。
     v0.3.3: 冷蔵庫タブの部門順を冷蔵→野菜室→冷凍に変更(実際の並びに合わせ、ピッカーのグループ順も同様に) /
     .fridge-sectionの背景を完全透過にし、色付き枠線(border)のみで部門を区別するよう変更。
     v0.3.2: 追加シート下部stickyバーに個数タイプ用の数量ステッパーを追加 / 在庫カードをフラット化・詰めてemoji-tapを40px→29pxにし
     卵などを1行10個表示可能に / 冷蔵庫タブの部門見出しを色付き棚風コンテナ+アイコン(🧊❄️🥬)化 / 絵文字ピッカーの「冷蔵」から
     調味料を「調味料」グループへ分離、グループ見出しの ':xxx:' トークンを画像化(リュクサク見出しをカスタム絵文字画像に)。
     v0.3.1: タブバーのカスタム絵文字画像(:ryukusaku:等)を拡大表示(.ce-tab) / 追加シートに絵文字プレビュー+名前入力+追加ボタンの
     sticky下部バーを新設(絵文字ピッカー選択時にその場で名前が見える) / 全要素にtouch-action:manipulationを適用しダブルタップズームを防止。
     v0.3.0: よく買うものプリセットをstate化(favorites・追加/削除UI)/ プリセットタップのフィードバック(アニメ+トースト+在庫バッジ)/
     絵文字ピッカーのジャンル分け表示 / 「リュサク」→「リュクサク」表記変更・タブアイコンをemojiHTML経由に。
     該当するUnicode絵文字が無い食材は CUSTOM_EMOJI レジストリ(':name:'キー→data URI画像、現在:mayo:/:natto:/:tofu:/:shiokombu:/:shoyu:/:sugar:/:cabbage:)で表示する。
     再描画のたびにシート/ページのスクロール位置を保存・復元する(render()参照)。
     追加シートで絵文字ピッカーを選ぶと EMOJI_TO_NAME 逆引きマップから名前を自動入力する(手入力は上書きしない)。

     データモデル (localStorage key: "aruzou-v1")
     {
       items:    [{ id, name, emoji, type:'count'|'gauge', qty, gauge(0-3),
                     cat:'fridge'|'daily'|'pet',
                     dept: 冷蔵庫='冷蔵'|'冷凍'|'野菜室'|'調味料' / 日用品='洗面所'|'風呂'|'掃除'|'洗濯'|'その他' / ペット=null,
                     addedAt, updatedAt(数値ms), deleted(真偽値・tombstone) }],
       shopping: [{ id, name, emoji, checked, cat, dept, addedAt, updatedAt, deleted }],
       dict:     { <名前>: {emoji, type, cat, dept, updatedAt} },  // 学習辞書
       receiptDict: { <正規化キー>: {name,emoji,type,cat,dept,updatedAt} または {ignore:true,updatedAt} } // レシート取り込みの学習辞書
       favorites: { fridge:[{name,emoji,type,dept,updatedAt,deleted}], daily:[...], pet:[...] } // よく買うもの(削除もtombstone)
       recipes:  [{ id, name, emoji, ingredients:[{name, qty, type:'count'|'gauge'}], updatedAt, deleted }]
                  // マイ料理(Phase 4)。材料はアイテムIDではなく「名前」で持つ(在庫は使い切ると
                  // 削除されるためID参照だと壊れる)。qtyはtype:'count'のときのみ使う。
     }
     Phase 2同期(任意機能・localStorage key: "aruzou-sync-v1")
     { url, token, enabled } — GAS Web AppのURLと合言葉。設定シート(🐘長押し/買い物リスト下部)で入力。
     未設定時は同期を一切行わずローカルのみで動作する。同期はpull+pushを1回のPOSTで行い、
     サーバーがマージした全データを返す方式(クライアント側にマージロジックは持たない)。

     素のJS・単一HTML・ビルド無し・CDN無し・外部通信ゼロ。
     全再描画方式(状態変更 → render())。フレームワーク不使用。
     =================================================================== */
  :root{
    --bg:#FFF8EF;
    --card:#FFFFFF;
    --main:#E08A3E;
    --main-dark:#C06F28;
    --accent:#F6B93B;
    --text:#4A3B2E;
    --sub:#A9998A;
    --sub2:#8C7C6D;
    --border:#F0E1CB;
    --border-strong:#E3CBA3;
    --danger:#D9705F;
    --section-bg:#FFF3E0;
  }
  *{ box-sizing:border-box; touch-action:manipulation; }
  html,body{ margin:0; padding:0; }
  html{ -webkit-text-size-adjust:100%; }
  body{
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
    overscroll-behavior-y:contain;
    -webkit-tap-highlight-color:transparent;
    min-height:100vh;
  }
  #app{
    min-height:100vh;
    padding-bottom:calc(96px + env(safe-area-inset-bottom));
    padding-left:env(safe-area-inset-left);
    padding-right:env(safe-area-inset-right);
  }
  button{
    font-family:inherit;
    user-select:none;
    -webkit-user-select:none;
  }
  input, select, textarea{
    font-family:inherit;
    font-size:16px; /* iOS自動ズーム防止のため16px未満は使わない */
  }

  /* ── ヘッダー ── */
  .header{
    display:flex; align-items:center; gap:8px;
    padding:calc(16px + env(safe-area-inset-top)) 18px 8px;
  }
  .header-char-img{ height:26px; width:auto; display:block; cursor:pointer; }
  .header-title{ font-size:21px; font-weight:800; color:var(--main-dark); letter-spacing:1px; }

  /* ── 汎用 ── */
  .field{
    width:100%; box-sizing:border-box; padding:11px 12px;
    border-radius:10px; border:1px solid var(--border);
    font-size:16px; font-family:inherit; color:var(--text); background:#FFF;
  }
  .tab-body{ padding:6px 16px 20px; }

  .add-btn{
    width:100%; padding:13px 0; margin-bottom:16px; border-radius:14px;
    border:1px dashed var(--border-strong); background:#FFF; color:var(--main-dark);
    font-weight:700; font-size:14px; cursor:pointer;
  }

  .section{ margin-bottom:16px; }
  .section-title{
    font-size:12.5px; font-weight:800; color:var(--main-dark);
    margin-bottom:6px; padding-left:2px; letter-spacing:1px;
  }
  .item-list{ display:flex; flex-direction:column; gap:4px; }

  /* item-card: v0.4.1で「名前行」+「絵文字行」の縦2段から、名前ブロック(左)+絵文字/ゲージ(右)の
     横1段に変更。名前は可変幅+省略記号にして残りの幅を絵文字列/ゲージに譲る。 */
  .item-card{
    display:flex; align-items:center; gap:4px;
    padding:6px 0;
    border-bottom:1px solid var(--border);
  }
  .item-card:last-child{ border-bottom:none; }
  .item-card.flash{ animation:popScale .26s ease; }
  @keyframes popScale{ 0%{transform:scale(1);} 45%{transform:scale(1.035);} 100%{transform:scale(1);} }

  .item-head{
    display:flex; align-items:center; gap:4px; cursor:pointer;
    flex:0 1 auto; min-width:52px; max-width:100px;
    overflow:hidden;
    padding:2px 0; min-height:32px; user-select:none; -webkit-user-select:none;
  }
  .item-emoji-lead{ font-size:18px; flex:0 0 auto; }
  .item-name{
    font-size:14px; font-weight:700; color:var(--text);
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }

  /* 個数もの: リード絵文字なし・名前だけにして幅を稼ぐ(右に同じ絵文字が並ぶため冗長) */
  .item-card-count .item-head{ min-width:44px; }

  .emoji-row{ flex:1 1 auto; display:flex; flex-wrap:wrap; gap:2px; }
  .emoji-tap{
    width:25px; height:25px; min-height:25px; font-size:14.5px; border:none;
    background:var(--section-bg); border-radius:7px; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    transition:transform .12s ease; padding:0;
  }
  .emoji-tap:active{ transform:scale(1.2); }
  .emoji-badge{
    min-width:25px; height:25px; padding:0 7px; font-size:12.5px; font-weight:800;
    color:#FFF; background:var(--main); border:none; border-radius:7px; cursor:pointer;
  }
  .emoji-badge:active{ transform:scale(1.1); }

  .gauge-row{
    flex:0 0 auto; display:flex; align-items:center; justify-content:center;
    background:transparent; border:none; border-radius:8px; padding:4px 8px;
    cursor:pointer; font-family:inherit; min-width:44px; min-height:44px;
  }
  .gauge-row:active{ transform:scale(1.06); }
  .gauge-dots{ font-size:16px; letter-spacing:3px; color:var(--main); }

  /* 残量もの2列グリッド(部門セクション内で個数ものの後にまとめて表示)。
     1セル=item-card-gauge(リード絵文字+名前+ゲージドットを1行に収める)。奇数個の場合は
     最後のセルが片側だけになるが、grid既定の挙動でレイアウトは崩れない。 */
  /* minmax(0,1fr)にしないと、長い名前(例:塩こんぶ超徳用袋)の最小幅で1frが押し広げられて
     2列目がセクション枠から右にはみ出す。min-width:0とellipsisも合わせて必須。 */
  .gauge-grid{ display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:6px 8px; }
  .item-card-gauge{
    border-bottom:none; padding:2px 4px 2px 6px; gap:2px;
    background:var(--section-bg); border-radius:10px;
    min-width:0; overflow:hidden;
  }
  .item-card-gauge .item-head{
    flex:1 1 auto; min-width:0; max-width:none;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .item-card-gauge .item-name{
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  /* ゲージドットは縮まず右端に残す(名前側だけを省略させる)。
     .gauge-rowの既定 width:100% は2列セル内ではセルを押し広げるので auto に戻す。 */
  .item-card-gauge .gauge-row{ flex:0 0 auto; width:auto; padding:9px 4px; min-height:40px; }
  /* 2列だと名前の幅が足りないので、ドット側を詰めて名前に回す(高さはmin-heightで確保) */
  .item-card-gauge .gauge-dots{ font-size:15px; letter-spacing:2.5px; }

  /* ── 冷蔵庫タブ専用: 部門セクションを棚/引き出し風に ── */
  .fridge-section{
    border-radius:14px; padding:10px 8px 12px; margin-bottom:14px;
    background:transparent; border:2px solid transparent;
  }
  .fridge-section .item-list{ gap:4px; }
  .fridge-section .item-card{ border-bottom-color:rgba(90,60,30,.08); }
  .fridge-section.dept-chilled{ border-color:#A9D3EC; }
  .fridge-section.dept-frozen{ border-color:#8FCBDC; }
  .fridge-section.dept-veggie{ border-color:#B9D89A; }
  .fridge-section.dept-condiment{ border-color:#EFC896; }
  .fridge-section-title{
    display:flex; align-items:center; gap:6px;
    font-size:12.5px; font-weight:800; letter-spacing:1px;
    margin-bottom:8px; padding-left:2px;
  }
  .fridge-section-title .handle{
    display:inline-block; width:22px; height:5px; border-radius:3px;
    background:rgba(0,0,0,.14);
  }
  .fridge-section.dept-chilled .fridge-section-title{ color:#3E7CA6; }
  .fridge-section.dept-frozen .fridge-section-title{ color:#2E8FA8; }
  .fridge-section.dept-veggie .fridge-section-title{ color:#5C8A3A; }
  .fridge-section.dept-condiment .fridge-section-title{ color:#B8823A; }

  .empty-state{ text-align:center; padding:40px 16px 20px; }
  .empty-char-img{ height:140px; width:auto; display:block; margin:0 auto 10px; }
  .empty-msg{ font-size:14.5px; color:var(--sub2); font-weight:700; }

  /* ── タブバー(下部固定) ── */
  .tab-bar{
    position:fixed; left:0; right:0; bottom:0; display:flex;
    background:#FFF; border-top:1px solid var(--border);
    padding:6px env(safe-area-inset-right) calc(6px + env(safe-area-inset-bottom)) env(safe-area-inset-left);
    z-index:20;
  }
  .tab-btn{
    flex:1; display:flex; flex-direction:column; align-items:center; gap:2px;
    padding:6px 0; background:none; border:none; cursor:pointer; color:var(--sub);
    min-height:48px;
  }
  .tab-btn.active{ color:var(--main-dark); }
  .tab-icon{ font-size:22px; }
  .tab-label{ font-size:10.5px; font-weight:700; }

  /* ── トースト ── */
  .toast{
    position:fixed; left:16px; right:16px; bottom:calc(78px + env(safe-area-inset-bottom));
    background:var(--text); color:#FFF; border-radius:14px; padding:12px 14px;
    box-shadow:0 6px 20px rgba(0,0,0,.25); z-index:40;
  }
  .toast-msg{ font-size:14px; font-weight:700; margin-bottom:6px; }
  .toast-row{ display:flex; align-items:center; gap:7px; margin-bottom:6px; }
  .toast-row .toast-msg{ margin-bottom:0; }
  .toast-char-img{ height:22px; width:auto; flex:0 0 auto; display:block; }
  .toast-actions{ display:flex; gap:8px; }
  .toast-btn{
    flex:1; padding:9px 0; border-radius:10px; border:none;
    background:rgba(255,255,255,.2); color:#FFF; font-weight:700; font-size:12.5px; cursor:pointer;
  }

  /* ── ボトムシート(追加・編集) ── */
  .sheet-backdrop{ position:fixed; inset:0; background:rgba(40,25,10,.35); z-index:50; }
  .sheet{
    position:fixed; left:0; right:0; bottom:0; max-height:88vh; overflow-y:auto;
    background:var(--bg); border-radius:20px 20px 0 0; z-index:51;
    padding-bottom:calc(16px + env(safe-area-inset-bottom));
    box-shadow:0 -8px 30px rgba(0,0,0,.2);
  }
  .sheet-head{
    display:flex; justify-content:space-between; align-items:center;
    padding:16px 18px 8px; font-size:16px; font-weight:800; color:var(--main-dark);
    position:sticky; top:0; background:var(--bg);
  }
  .sheet-close{ border:none; background:none; font-size:24px; color:var(--sub2); cursor:pointer; padding:2px 8px; }
  .sheet-body{ padding:4px 18px 6px; display:flex; flex-direction:column; gap:10px; }
  .sheet-label{ font-size:12px; font-weight:700; color:var(--sub2); margin-top:6px; }
  .sheet-divider{ font-size:11.5px; color:var(--sub); text-align:center; margin:8px 0 2px; }
  .sheet-actions{ display:flex; gap:10px; padding:14px 18px 4px; align-items:center; }

  /* ── 追加シート下部固定バー(絵文字プレビュー+名前+追加) ── */
  .add-sticky-bar{
    position:sticky; bottom:0; left:0; right:0; z-index:5;
    display:flex; align-items:center; gap:6px;
    padding:10px 18px calc(10px + env(safe-area-inset-bottom));
    background:var(--bg); border-top:1px solid var(--border);
  }
  .add-sticky-emoji{
    flex:none; width:38px; height:38px; display:flex; align-items:center; justify-content:center;
    font-size:28px; border-radius:10px; background:var(--section-bg);
  }
  .add-sticky-name{ flex:1; width:auto; min-width:0; }
  .add-sticky-bar .btn-primary{ flex:none; padding:11px 14px; white-space:nowrap; }
  .sticky-stepper{ flex:none; display:flex; align-items:center; gap:2px; }
  .sticky-stepper-btn{
    width:38px; height:38px; min-width:38px; border-radius:9px; border:1px solid var(--border);
    background:#FFF; font-size:16px; font-weight:800; color:var(--main-dark); cursor:pointer; padding:0;
  }
  .sticky-stepper-val{ font-size:13px; font-weight:800; min-width:18px; text-align:center; }

  .favorites-header{ display:flex; align-items:center; justify-content:space-between; }
  .favorites-header .sheet-label{ margin-top:0; }
  .favorites-edit-toggle{
    font-size:11.5px; font-weight:700; color:var(--main-dark); background:none;
    border:none; cursor:pointer; padding:4px 6px;
  }

  .preset-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
  .preset-btn{
    position:relative; display:flex; flex-direction:column; align-items:center; gap:2px; padding:10px 4px;
    border-radius:12px; border:1px solid var(--border); background:#FFF; cursor:pointer;
    font-family:inherit; min-height:44px;
  }
  .preset-btn.flash{ animation:presetPop .26s ease; }
  @keyframes presetPop{ 0%{transform:scale(1);} 45%{transform:scale(1.15);} 100%{transform:scale(1);} }
  .preset-emoji{ font-size:22px; }
  .preset-name{ font-size:11px; color:var(--text); font-weight:600; }
  .preset-badge{
    position:absolute; top:-6px; right:-6px; min-width:17px; height:17px; padding:0 4px;
    border-radius:9px; background:var(--main); color:#FFF; font-size:10px; font-weight:800;
    display:flex; align-items:center; justify-content:center; box-shadow:0 1px 3px rgba(0,0,0,.2);
  }
  .preset-delete-badge{
    position:absolute; top:-6px; right:-6px; width:18px; height:18px;
    border-radius:50%; background:var(--danger); color:#FFF; font-size:12px; font-weight:800;
    display:flex; align-items:center; justify-content:center; box-shadow:0 1px 3px rgba(0,0,0,.2);
    cursor:pointer;
  }

  .fav-checkbox-row{
    display:flex; align-items:center; gap:8px; font-size:13px; color:var(--sub2);
    font-weight:600; margin-top:6px; cursor:pointer;
  }
  .fav-checkbox-row input[type="checkbox"]{ width:18px; height:18px; accent-color:var(--main); }

  .emoji-input{ font-size:20px; text-align:center; }
  .emoji-group-label{
    font-size:10.5px; font-weight:700; color:var(--sub); letter-spacing:.5px;
    margin:8px 2px 2px;
  }
  .emoji-group-label:first-of-type{ margin-top:2px; }
  .emoji-grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:6px; }
  .emoji-choice{
    font-size:20px; padding:7px 0; border-radius:8px; border:1px solid transparent;
    background:var(--section-bg); cursor:pointer; min-height:40px;
  }
  .emoji-choice.selected{ border-color:var(--main); background:#FFF; }

  /* ── カスタム絵文字画像(CUSTOM_EMOJI) ── */
  .custom-emoji-img{ object-fit:contain; vertical-align:middle; display:inline-block; }
  .ce-16{ width:16px; height:16px; }
  .ce-18{ width:18px; height:18px; }
  .ce-20{ width:20px; height:20px; }
  .ce-22{ width:22px; height:22px; }
  .ce-tab{ width:34px; height:26px; }
  .ce-32{ width:32px; height:32px; }

  .segmented{ display:flex; border:1px solid var(--border); border-radius:12px; overflow:hidden; }
  .seg-btn{
    flex:1; padding:11px 0; background:#FFF; border:none; font-size:13.5px; font-weight:700;
    color:var(--sub2); cursor:pointer; font-family:inherit; min-height:44px;
  }
  .seg-btn.active{ background:var(--main); color:#FFF; }

  .stepper{ display:flex; align-items:center; justify-content:center; gap:18px; }
  .stepper-btn{
    width:42px; height:42px; border-radius:10px; border:1px solid var(--border);
    background:#FFF; font-size:18px; font-weight:800; color:var(--main-dark); cursor:pointer;
  }
  .stepper-val{ font-size:19px; font-weight:800; min-width:36px; text-align:center; }

  .gauge-select{ display:flex; gap:6px; }
  .gauge-opt{
    flex:1; padding:11px 2px; border-radius:10px; border:1px solid var(--border);
    background:#FFF; font-size:12px; font-weight:700; color:var(--sub2); cursor:pointer; min-height:44px;
  }
  .gauge-opt.active{ background:var(--main); color:#FFF; border-color:var(--main); }

  .btn-outline{
    flex:1; padding:13px 0; border-radius:14px; border:1px solid var(--border-strong);
    background:#FFF; color:var(--main-dark); font-weight:700; font-size:14px; cursor:pointer;
  }
  .btn-outline[disabled]{ opacity:.4; }
  .btn-primary{
    flex:1; padding:13px 0; border-radius:14px; border:none;
    background:var(--main); color:#FFF; font-weight:700; font-size:14px; cursor:pointer;
    box-shadow:0 4px 14px rgba(224,138,62,.35);
  }
  .btn-primary[disabled]{ opacity:.4; box-shadow:none; }
  .delete-link{
    border:none; background:none; color:var(--danger); font-weight:700; font-size:14px;
    cursor:pointer; padding:13px 12px;
  }

  /* ── 買い物リストタブ ── */
  .shopping-add-row{ display:flex; gap:8px; margin-bottom:16px; }
  .shopping-add-row .field{ flex:1; }
  .add-btn.small{
    width:44px; height:44px; border-radius:12px; border:none;
    background:var(--main); color:#FFF; font-size:20px; margin:0; padding:0; flex:none;
  }
  .shopping-row{
    display:flex; align-items:center; gap:10px; background:var(--card);
    border-radius:14px; padding:10px 12px;
  }
  .shopping-row.checked .shopping-name{ text-decoration:line-through; color:var(--sub); }
  .check-box{
    width:27px; height:27px; border-radius:8px; border:2px solid var(--border-strong);
    background:#FFF; color:#FFF; font-size:14px; font-weight:800;
    display:flex; align-items:center; justify-content:center; cursor:pointer; flex:none;
  }
  .shopping-row.checked .check-box{ background:var(--main); border-color:var(--main); }
  .shopping-emoji{ font-size:18px; }
  .shopping-name{ flex:1; font-size:14.5px; font-weight:600; color:var(--text); }
  .x-btn{
    width:30px; height:30px; border-radius:50%; border:none; background:var(--section-bg);
    color:var(--sub2); font-size:14px; cursor:pointer; flex:none;
  }
  .shopping-actions{ display:flex; gap:10px; margin-top:18px; }

  /* ── レシート取り込み(Phase 3) ── */
  .receipt-btn{
    width:100%; padding:12px 0; margin-bottom:14px; border-radius:14px;
    border:1px dashed var(--border-strong); background:#FFF9F0; color:var(--main-dark);
    font-weight:700; font-size:14px; cursor:pointer;
  }
  .receipt-hint{ font-size:12.5px; color:var(--sub2); line-height:1.5; }
  .receipt-textarea{ min-height:140px; resize:vertical; line-height:1.5; }
  .receipt-summary{ font-size:14px; font-weight:800; color:var(--main-dark); }
  .receipt-date{ font-size:12px; color:var(--sub2); margin-bottom:4px; }
  .receipt-cand{
    border:1px solid var(--border); border-radius:14px; padding:10px 12px;
    margin-bottom:10px; background:#FFF;
  }
  .receipt-cand.is-new{ border-color:var(--accent); background:#FFFBF0; }
  .receipt-cand.off{ opacity:.45; }
  .receipt-cand-top{ display:flex; align-items:center; gap:8px; }
  .receipt-cand-raw{ font-size:11px; color:var(--sub); margin:2px 0 6px 34px; }
  .receipt-cand-new-badge{
    font-size:10px; font-weight:800; color:var(--main-dark); background:var(--section-bg);
    border-radius:6px; padding:2px 6px; flex:none;
  }
  .receipt-toggle{
    width:26px; height:26px; border-radius:8px; border:2px solid var(--border-strong);
    background:#FFF; display:flex; align-items:center; justify-content:center;
    font-size:14px; font-weight:800; color:#FFF; flex:none; cursor:pointer; padding:0;
  }
  .receipt-toggle.on{ background:var(--main); border-color:var(--main); }
  .receipt-cand-emoji-btn{
    width:34px; height:34px; border-radius:9px; background:var(--section-bg); border:none;
    font-size:20px; display:flex; align-items:center; justify-content:center; flex:none; cursor:pointer; padding:0;
  }
  .receipt-cand-name{ flex:1; min-width:0; padding:8px 10px; font-size:14.5px; }
  .receipt-cand-row{ display:flex; align-items:center; gap:8px; margin-top:8px; }
  .receipt-cand-stepper{ display:flex; align-items:center; gap:6px; }
  .receipt-mini-select{ flex:1; padding:8px 6px; font-size:12.5px; }
  .receipt-ignore-btn{
    font-size:11px; color:var(--sub2); background:none; border:none;
    text-decoration:underline; cursor:pointer; padding:4px 2px;
  }
  .segmented.receipt-seg .seg-btn{ padding:8px 0; font-size:12.5px; min-height:36px; }

  /* ── 設定シート(Phase 2 GAS同期) ── */
  .settings-entry{
    width:100%; text-align:center; padding:10px 0; margin-top:6px;
    border:none; background:none; color:var(--sub2); font-size:12.5px; font-weight:600; cursor:pointer;
  }
  .sync-toggle-row{
    display:flex; align-items:center; justify-content:space-between;
    font-size:14px; font-weight:700; color:var(--text); margin-top:4px;
  }
  .sync-toggle-row .seg-btn{ min-width:64px; flex:none; padding:9px 16px; }
  .sync-toggle-row .segmented{ width:auto; }
  .sync-status{
    font-size:12.5px; color:var(--sub2); line-height:1.5; margin-top:2px; min-height:1.5em;
  }
  .sync-status.ok{ color:#3E8A5C; font-weight:700; }
  .sync-status.ng{ color:var(--danger); font-weight:700; }
  .sync-hint{ font-size:11.5px; color:var(--sub); line-height:1.5; }
  /* 配布確認用バージョン表示。設定シート最下部にだけ小さく控えめに出す(通常画面には出さない) */
  .settings-version{ font-size:10.5px; color:var(--sub2); text-align:center; padding:10px 18px 14px; }

  /* ── マイ料理(Phase 4) ── */
  .recipe-btn{
    width:100%; padding:12px 0; margin-bottom:14px; border-radius:14px;
    border:1px dashed var(--border-strong); background:#FFF9F0; color:var(--main-dark);
    font-weight:700; font-size:14px; cursor:pointer;
  }
  .sheet-back{ border:none; background:none; font-size:20px; color:var(--sub2); cursor:pointer; padding:2px 8px; }
  .recipe-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
  .recipe-card{ position:relative; }
  .recipe-card-main{
    width:100%; display:flex; flex-direction:column; align-items:center; gap:4px; padding:14px 4px 10px;
    border-radius:14px; border:1px solid var(--border); background:#FFF; cursor:pointer; font-family:inherit; min-height:44px;
  }
  .recipe-card-emoji{ font-size:30px; line-height:1; }
  .recipe-card-name{ font-size:12px; font-weight:700; color:var(--text); text-align:center; word-break:break-all; }
  .recipe-card-edit{
    position:absolute; top:-6px; right:-6px; width:26px; height:26px; border-radius:50%;
    background:var(--section-bg); border:1px solid var(--border-strong); color:var(--main-dark);
    font-size:12px; cursor:pointer; display:flex; align-items:center; justify-content:center; padding:0;
  }
  .recipe-pick-grid{ display:flex; flex-wrap:wrap; gap:6px; }
  .recipe-pick-chip{
    display:flex; align-items:center; gap:4px; padding:7px 10px; border-radius:20px;
    border:1px solid var(--border); background:#FFF; font-size:12.5px; font-weight:600; color:var(--text);
    cursor:pointer; font-family:inherit;
  }
  .recipe-pick-empty{ font-size:12px; color:var(--sub); }
  .recipe-ing-add-row{ display:flex; gap:8px; }
  .recipe-ing-list{ display:flex; flex-direction:column; gap:8px; }
  .recipe-ing-row{
    display:flex; align-items:center; gap:8px; border:1px solid var(--border); border-radius:12px;
    padding:8px 10px; background:#FFF; flex-wrap:wrap;
  }
  .recipe-ing-name{ flex:1; min-width:70px; font-size:14px; font-weight:700; color:var(--text); }
  .recipe-ing-seg{ flex:none; width:112px; }
  .recipe-ing-seg .seg-btn{ padding:7px 0; font-size:11.5px; min-height:34px; }
  .recipe-ing-gauge-label{ font-size:12px; color:var(--sub2); font-weight:700; padding:0 4px; }

  /* ── 「作った」確認画面 ── */
  .cook-summary{ font-size:12.5px; color:var(--sub2); }
  .cook-row{
    border:1px solid var(--border); border-radius:14px; padding:10px 12px; margin-bottom:10px; background:#FFF;
  }
  .cook-row.missing{ opacity:.55; }
  .cook-row.short{ border-color:var(--accent); background:#FFFBF0; }
  .cook-row-top{ display:flex; align-items:center; gap:8px; }
  .cook-row-emoji{
    width:32px; height:32px; border-radius:9px; background:var(--section-bg);
    display:flex; align-items:center; justify-content:center; font-size:19px; flex:none;
  }
  .cook-row-name{ flex:1; min-width:0; font-size:14.5px; font-weight:700; color:var(--text); }
  .cook-row-msg{ font-size:12px; color:var(--sub2); margin:4px 0 8px 42px; line-height:1.5; }
  .cook-row-msg.short{ color:var(--main-dark); font-weight:700; }
  .cook-row-msg.missing{ color:var(--sub); }
  .cook-row-ctrl{ margin-left:42px; }
</style>
</head>
<body>
<div id="app"></div>
<script>
(function(){
  "use strict";

  // ─────────────────────────────────────────
  // 定数: カテゴリ・部門・プリセット・絵文字辞書

  // キュー方式に書き直したのに合わせて、ここも「無条件に捨てる行」の判定を1本化した
  // (旧版は割引行と直後の金額行をセットで消費していたが、新版は割引/売変/レジ袋を含む行と
  // 割引額そのもの(負の数の行)を別々にノイズ判定するので、隣接している必要がなくなった)。
  var RECEIPT_NOISE_WORDS = ["★割引", "値引", "売変", "レジ袋"];
  var RECEIPT_CUTOFF_WORDS = ["小計", "合計", "お買上", "PayPay", "楽天ペイ", "※印は", "領収証", "登録番号"];
  // 確定金額行: ※・内が付く数字、または¥付きの数字(¥のみは末尾マーカー無しでも確定扱い)
  var RECEIPT_MONEY_RE = /^(?:[¥￥]\s*[\d,]+\s*(?:内)?|[\d,]+\s*(?:内|※))$/;
  // 曖昧な数字行: マーカーの付かない数字だけの行(商品コード単独行の可能性もあるので即採用しない)
  var RECEIPT_AMBIGUOUS_RE = /^[\d,]+$/;
  // 割引額などの負の数だけの行(例: -35 -50)
  var RECEIPT_NEGATIVE_RE = /^-[\d,]+$/;
  // 商品名先頭の商品コード(2〜4桁)
  var RECEIPT_CODE_RE = /^\d{2,4}\s*/;
  // 数量注記(例: （@139✕2個） (@99 x 3個))。全角/半角の括弧・✕×xX・空白の揺れを許容
  var RECEIPT_QTY_RE = /^[（(]\s*@?\s*[\d,]+\s*[✕×xX]\s*(\d+)\s*個\s*[）)]\s*$/;
  // 商品名+金額が同じ行にあるパターン(例: ソフティモ2倍W12R ¥690内)
  var RECEIPT_COMBINED_RE = /^(.+?)\s*[¥￥]\s*([\d,]+)\s*(?:内|※)?\s*$/;
  var RECEIPT_DATE_RE = /\d{4}年\d{1,2}月\d{1,2}日/;
  // 曖昧な数字行を商品名に割り当てる際の最大許容行距離(これを超えたら「近くに無い」扱い)
  var RECEIPT_AMBIGUOUS_MAX_DIST = 5;

  // ─────────────────────────────────────────
  // ユーティリティ
  // ─────────────────────────────────────────
  function newId(){
    return "i" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  }
  function esc(s){
    return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }
  function defaultEmojiForCat(cat){
    return cat === "daily" ? "🧴" : cat === "pet" ? "🐾" : "🍽";
  }
  // 絵文字表示の共通ヘルパー。値が ':xxx:' 形式でCUSTOM_EMOJIに登録があれば画像を、
  // 無ければ従来どおりのテキスト絵文字を返す。sizeClassは .ce-18/.ce-20/.ce-22 等。
  function emojiHTML(emoji, sizeClass){
    var key = emoji == null ? "" : String(emoji);
    var src = CUSTOM_EMOJI[key];
    if (src) {
      return '<img src="' + src + '" class="custom-emoji-img' + (sizeClass ? ' ' + sizeClass : '') + '" alt="">';
    }
    return esc(key);
  }
  // ジャンル見出しラベルを描画する。ラベル中の ':xxx:' 形式トークンはCUSTOM_EMOJIに登録があれば
  // 画像に置換する(例: ":ryukusaku: リュクサク" → 🐱画像 + " リュクサク")。無ければそのまま表示。
  function renderGroupLabelHtml(label){
    return esc(label).replace(/:[a-z0-9_]+:/gi, function(token){
      return CUSTOM_EMOJI[token] ? emojiHTML(token, 'ce-20') : token;
    });
  }
  // 絵文字ピッカーをジャンル見出し付きグリッドで描画する共通ヘルパー(追加・編集シート共通)。
  function renderEmojiGroupsHtml(selectedEmoji, action){
    return EMOJI_GROUPS.map(function(g){
      var grid = g.items.map(function(em){
        var sel = selectedEmoji === em ? ' selected' : '';
        return '<button class="emoji-choice' + sel + '" data-action="' + action + '" data-emoji="' + esc(em) + '">' + emojiHTML(em, 'ce-20') + '</button>';
      }).join('');
      return '<div class="emoji-group-label">' + renderGroupLabelHtml(g.label) + '</div><div class="emoji-grid">' + grid + '</div>';
    }).join('');
  }

  // ─────────────────────────────────────────
  // ストレージ
  // ─────────────────────────────────────────
  function persist(d){
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(d)); }
    catch (e) { console.error("保存に失敗", e); }
    // Phase 2同期: あらゆる変更後にデバウンス予約する(scheduleSyncは同期モジュール参照。
    // 未設定/受信直後はscheduleSync内部で何もしない)。関数宣言はホイスティングされるため
    // 定義順は問わない。
    scheduleSync();
  }
  function normalizeData(d){
    if (!d || typeof d !== "object") d = {};
    if (!Array.isArray(d.items)) d.items = [];
    if (!Array.isArray(d.shopping)) d.shopping = [];
    if (!d.dict || typeof d.dict !== "object") d.dict = {};
    if (!d.receiptDict || typeof d.receiptDict !== "object") d.receiptDict = {};
    if (!d.favorites || typeof d.favorites !== "object") d.favorites = {};
    if (!Array.isArray(d.recipes)) d.recipes = []; // マイ料理(Phase 4)。既存データとの互換を壊さないよう無ければ空配列で初期化する
    // recipesは新設フィールドなのでmigrateSyncFields(1回きり)を待たず、読み込みのたびに
    // updatedAt/deletedの欠落だけ補っておく(壊れた/古い同期データが来ても落ちないための安全網)。
    d.recipes.forEach(function(r){
      if (r && typeof r.updatedAt !== "number") r.updatedAt = Date.now();
      if (r && typeof r.deleted !== "boolean") r.deleted = false;
    });
    if (!d.migrations || typeof d.migrations !== "object") d.migrations = {};
    // 「よく買うもの」はPRESETSを初期値としてstate化している。無ければ既定値をコピーして初期化する(1回きり)。
    ["fridge", "daily", "pet"].forEach(function(cat){
      if (!Array.isArray(d.favorites[cat])) {
        d.favorites[cat] = JSON.parse(JSON.stringify(PRESETS[cat] || []));
      }
    });
    return d;
  }
  // 旧データ移行: 名前と旧絵文字が一致するエントリをCUSTOM_EMOJIキーに書き換える(1回きりの軽い処理)。
  // 今後カスタム絵文字を追加する際はこのリストにも1行足す。
  var LEGACY_EMOJI_MIGRATIONS = [
    { name:"マヨネーズ", oldEmoji:"🥚", newKey:":mayo:" },
    { name:"納豆", oldEmoji:"🫘", newKey:":natto:" },
    { name:"豆腐", oldEmoji:"🍥", newKey:":tofu:" },
    { name:"塩昆布", oldEmoji:"🌊", newKey:":shiokombu:" },
    { name:"醤油", oldEmoji:"🍶", newKey:":shoyu:" },
    { name:"しょうゆ", oldEmoji:"🍶", newKey:":shoyu:" },
    { name:"砂糖", oldEmoji:"🍬", newKey:":sugar:" },
    { name:"キャベツ", oldEmoji:"🥬", newKey:":cabbage:" }
  ];
  function migrateLegacyEmoji(d){
    function fix(obj){
      if (!obj) return;
      for (var i = 0; i < LEGACY_EMOJI_MIGRATIONS.length; i++){
        var m = LEGACY_EMOJI_MIGRATIONS[i];
        if (obj.name === m.name && obj.emoji === m.oldEmoji) { obj.emoji = m.newKey; return; }
      }
    }
    (d.items || []).forEach(fix);
    (d.shopping || []).forEach(fix);
    LEGACY_EMOJI_MIGRATIONS.forEach(function(m){
      if (d.dict && d.dict[m.name] && d.dict[m.name].emoji === m.oldEmoji) {
        d.dict[m.name].emoji = m.newKey;
      }
    });
  }
  // v0.4.1データ移行: 「調味料」部門の新設に伴い、fridgeカテゴリの調味料アイテムのdeptを
  // "調味料"へ書き換える(1回きり)。旧絵文字移行と違いdept書き換えは自然にべき等ではない
  // (ユーザーが手動で他部門に戻す可能性がある)ため、d.migrations.condimentDeptで再実行を防ぐ。
  // 判定対象 = 調味料名リスト(CONDIMENT_NAMES) または EMOJI_GROUPSの「調味料」グループの絵文字。
  var CONDIMENT_NAMES = [
    "醤油", "しょうゆ", "塩", "砂糖", "味噌", "みそ", "マヨネーズ", "塩昆布", "カレールー",
    "ケチャップ", "ソース", "酢", "みりん", "料理酒", "めんつゆ", "だし", "油"
  ];
  var CONDIMENT_EMOJIS = (function(){
    var g = EMOJI_GROUPS.filter(function(x){ return x.label === "調味料"; })[0];
    return g ? g.items.slice() : [];
  })();
  function isCondimentEntry(obj){
    if (!obj) return false;
    if (obj.name && CONDIMENT_NAMES.indexOf(obj.name) !== -1) return true;
    if (obj.emoji != null && CONDIMENT_EMOJIS.indexOf(obj.emoji) !== -1) return true;
    return false;
  }
  function migrateCondimentDept(d){
    if (d.migrations && d.migrations.condimentDept) return;
    (d.items || []).forEach(function(it){
      if (it.cat === "fridge" && isCondimentEntry(it) && it.dept !== "調味料") it.dept = "調味料";
    });
    (d.shopping || []).forEach(function(s){
      if (s.cat === "fridge" && isCondimentEntry(s) && s.dept !== "調味料") s.dept = "調味料";
    });
    if (d.favorites && Array.isArray(d.favorites.fridge)) {
      d.favorites.fridge.forEach(function(f){
        if (isCondimentEntry(f) && f.dept !== "調味料") f.dept = "調味料";
      });
    }
    Object.keys(d.dict || {}).forEach(function(name){
      var e = d.dict[name];
      if (e && e.cat === "fridge" && isCondimentEntry({ name:name, emoji:e.emoji }) && e.dept !== "調味料") {
        e.dept = "調味料";
      }
    });
    d.migrations = d.migrations || {};
    d.migrations.condimentDept = true;
  }
  // v0.5.0データ移行: Phase 2「GAS同期」用にitems/shopping/favoritesの各レコードへ
  // updatedAt(数値ms)・deleted(真偽値)を付与する(1回きり。既に付いているものは触らない)。
  function migrateSyncFields(d){
    if (d.migrations && d.migrations.syncFields) return;
    var now = Date.now();
    (d.items || []).forEach(function(it){
      if (typeof it.updatedAt !== "number") it.updatedAt = now;
      if (typeof it.deleted !== "boolean") it.deleted = false;
    });
    (d.shopping || []).forEach(function(s){
      if (typeof s.updatedAt !== "number") s.updatedAt = now;
      if (typeof s.deleted !== "boolean") s.deleted = false;
    });
    ["fridge", "daily", "pet"].forEach(function(cat){
      (d.favorites[cat] || []).forEach(function(f){
        if (typeof f.updatedAt !== "number") f.updatedAt = now;
        if (typeof f.deleted !== "boolean") f.deleted = false;
      });
    });
    d.migrations = d.migrations || {};
    d.migrations.syncFields = true;
  }
  function loadData(){
    var d = null;
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (raw) d = JSON.parse(raw);
    } catch (e) {}
    d = normalizeData(d);
    migrateLegacyEmoji(d);
    migrateCondimentDept(d);
    migrateSyncFields(d);
    persist(d);
    return d;
  }

  // ─────────────────────────────────────────

  var S = {

    favoritesEditMode: false, // よく買うものグリッドの編集(削除)モード

    settingsTestResult: null, // 接続テストの結果 { ok, msg } または null
    settingsBusy: false,      // 接続テスト/今すぐ同期の実行中フラグ(ボタン多重防止)
    recipeOpen: false,        // マイ料理シート(Phase 4)の開閉
    recipeView: "list",       // list(一覧) | edit(登録・編集) | cook(「作った」確認)
    recipeForm: null,         // 編集中のレシピ { id(新規はnull), name, emoji, ingredients:[{name,qty,type}] }
    recipeIngredientInput: "",// 材料の手入力欄
    cookForm: null,           // 「作った」確認中の状態 { recipeId, name, emoji, rows:[...] }(buildCookForm参照)
  };
  var undoSnapshot = null; // 直前の1操作分のデータスナップショット(JSON文字列)
  var toastTimer = null;

  function currentData(){ return S.data; }

  // ─────────────────────────────────────────
  // Undo / トースト
  // ─────────────────────────────────────────
  function pushUndo(){
    undoSnapshot = JSON.stringify(S.data);
  }
  function doUndo(){
    if (!undoSnapshot) { hideToast(); render(); return; }
    S.data = JSON.parse(undoSnapshot);
    undoSnapshot = null;
    persist(S.data);
    hideToast();
    showToast("もどしたぞう", [], 2200);
  }
  // img: 完了・成功トーストにだけchar-joy.png等を小さく添える任意パラメータ(「やりすぎない」方針で
  // 毎回出る個別消費トーストには渡さない。呼び出し側でパスを直接指定する)
  function showToast(msg, buttons, duration, data, img){
    if (toastTimer) clearTimeout(toastTimer);
    S.toast = { msg: msg, buttons: buttons || [], data: data || null, img: img || null };
    render();
    toastTimer = setTimeout(function(){
      S.toast = null;
      toastTimer = null;
      render();
    }, duration || 3000);
  }
  function hideToast(){

  function flashThenRender(id){

  // ─────────────────────────────────────────
  // 在庫アイテム操作
  // ─────────────────────────────────────────
  // 同cat+nameの既存アイテムを探す(削除済みtombstoneは除外)。新規追加時は「同名の
  // tombstoneが無いか」も別途探して復活させる(revive)。物理削除しないため、同名を
  // 何度も削除→追加すると配列は増え続けるが、tombstoneを再利用することで抑える。
  function upsertItem(cat, name, emoji, type, dept){
    var items = S.data.items;
    var existing = null;
    var tombstoned = null;
    for (var i = 0; i < items.length; i++){
      if (items[i].cat === cat && items[i].name === name) {
        if (!items[i].deleted) { existing = items[i]; break; }
        else if (!tombstoned) { tombstoned = items[i]; }
      }
    }
    if (existing) {
      if (existing.type === "count") existing.qty = (existing.qty || 0) + 1;
      else existing.gauge = 3;
      existing.updatedAt = Date.now();
    } else if (tombstoned) {
      tombstoned.deleted = false;
      tombstoned.emoji = emoji;
      tombstoned.type = type;
      tombstoned.dept = dept;
      tombstoned.qty = type === "count" ? 1 : 0;
      tombstoned.gauge = type === "gauge" ? 3 : 0;
      tombstoned.updatedAt = Date.now();
    } else {
      items.push({
        id: newId(), name: name, emoji: emoji, type: type,
        qty: type === "count" ? 1 : 0,
        gauge: type === "gauge" ? 3 : 0,
        cat: cat, dept: dept, addedAt: Date.now(),
        updatedAt: Date.now(), deleted: false
      });
    }
    S.data.dict[name] = { emoji: emoji, type: type, cat: cat, dept: dept, updatedAt: Date.now() };
    persist(S.data);
  }

  // 買い物リストに無ければ追加する。削除済み(tombstone)の同名同カテゴリがあれば
  // 新規pushせずそれを復活させる(配列の無限増殖を防ぐ)。
  function addToShoppingIfNotExists(name, emoji, cat, dept){
    var list = S.data.shopping;
    var existing = null;
    var tombstoned = null;
    for (var i = 0; i < list.length; i++){
      if (list[i].name === name && list[i].cat === cat) {
        if (!list[i].deleted) { existing = list[i]; break; }
        else if (!tombstoned) { tombstoned = list[i]; }
      }
    }
    if (existing) return false;
    if (tombstoned) {
      tombstoned.deleted = false;
      tombstoned.checked = false;
      tombstoned.emoji = emoji;
      tombstoned.dept = dept;
      tombstoned.updatedAt = Date.now();
    } else {
      list.push({ id:newId(), name:name, emoji:emoji, checked:false, cat:cat, dept:dept, addedAt:Date.now(), updatedAt:Date.now(), deleted:false });
    }
    persist(S.data);
    return true;
  }

  // 削除済み(tombstone)は無かったものとして扱う共通関数。以後のロジックは全てこれ経由で
  // アイテムを取得するため、deleted:trueのレコードが誤って操作対象になることはない。
  function findItem(id){
    for (var i = 0; i < S.data.items.length; i++){
      if (S.data.items[i].id === id && !S.data.items[i].deleted) return S.data.items[i];
    }
    return null;
  }

  // 個数ものを1個消費する。0になったらtombstone化(deleted:true)し、買い物リストへの追加を促すトーストを出す
  function consumeItem(id){
    var it = findItem(id);
    if (!it || it.type !== "count") return;
    pushUndo();
    it.qty -= 1;
    if (it.qty <= 0) {
      it.deleted = true;
      it.updatedAt = Date.now();
      persist(S.data);
      showToast("つかいきったぞう！", [
        { label:"もどす", action:"toast-undo" },
        { label:"🛒買い物リストに入れる", action:"toast-add-shopping" }
      ], 6000, { name: it.name, emoji: it.emoji, cat: it.cat, dept: it.dept });
    } else {
      it.updatedAt = Date.now();
      persist(S.data);
      flashThenRender(it.id);
      showToast("つかったぞう", [{ label:"もどす", action:"toast-undo" }], 3000);
    }
  }

  // 残量ものを1段階減らす。0のときはタップしても何もしない
  function tapGauge(id){
    var it = findItem(id);
    if (!it || it.type !== "gauge") return;
    if (it.gauge <= 0) return;
    pushUndo();
    it.gauge -= 1;
    it.updatedAt = Date.now();
    persist(S.data);
    if (it.gauge <= 1) {
      addToShoppingIfNotExists(it.name, it.emoji, it.cat, it.dept);
      flashThenRender(it.id);
      showToast("そろそろないぞう", [{ label:"もどす", action:"toast-undo" }], 4000);
    } else {
      flashThenRender(it.id);
      showToast("つかったぞう", [{ label:"もどす", action:"toast-undo" }], 3000);
    }
  }

  // アイテム削除はtombstone方式(deleted:true + updatedAt更新)。物理削除(splice)すると

  function deleteItem(id){
    var it = findItem(id);
    if (!it) return;
    pushUndo();
    it.deleted = true;
    it.updatedAt = Date.now();
    persist(S.data);
    closeEditSheet();
    showToast("けしたぞう", [{ label:"もどす", action:"toast-undo" }], 3500);
  }

  // ─────────────────────────────────────────

  var FAVORITES_LIMIT = 20;

  // 削除済み(tombstone)を除いた「よく買うもの」一覧。描画・重複判定・上限カウントは
  // すべてこれ経由にすることでdeletedレコードが表示/カウントに紛れ込まないようにする。
  function activeFavorites(cat){
    return (S.data.favorites[cat] || []).filter(function(p){ return !p.deleted; });
  }

  // よく買うものへ追加(重複無視・上限あり)。 { ok, reason:"full"|"duplicate" } を返す。
  // 削除済み(tombstone)の同名エントリがあれば復活させる(配列の無限増殖を防ぐ)。
  function addFavoriteIfPossible(cat, name, emoji, type, dept){
    var list = S.data.favorites[cat];
    if (!list) return { ok:false };
    var existing = null;
    for (var i = 0; i < list.length; i++){ if (list[i].name === name) { existing = list[i]; break; } }
    if (existing && !existing.deleted) return { ok:true, duplicate:true };
    if (!existing && activeFavorites(cat).length >= FAVORITES_LIMIT) return { ok:false, reason:"full" };
    if (existing) {
      existing.deleted = false;
      existing.emoji = emoji;
      existing.type = type;
      existing.dept = dept;
      existing.updatedAt = Date.now();
    } else {
      list.push({ name:name, emoji:emoji, type:type, dept:dept, updatedAt:Date.now(), deleted:false });
    }
    persist(S.data);
    return { ok:true };
  }

  // よく買うものの削除もtombstone方式(deleted:true + updatedAt更新)にする。
  function deleteFavorite(cat, name){
    var list = S.data.favorites[cat];
    if (!list) return;
    var idx = -1;
    for (var i = 0; i < list.length; i++){ if (list[i].name === name && !list[i].deleted) { idx = i; break; } }
    if (idx < 0) return;
    pushUndo();
    list[idx].deleted = true;
    list[idx].updatedAt = Date.now();
    persist(S.data);
    showToast("けしたぞう", [{ label:"もどす", action:"toast-undo" }], 3000);
  }

  function addPreset(cat, preset){
    upsertItem(cat, preset.name, preset.emoji, preset.type, preset.dept);
