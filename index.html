  function submitAddForm(){
    var f = S.addForm;
    var name = (f.name || "").trim();
    if (!name) return;
    var emoji = (f.emoji || "").trim() || defaultEmojiForCat(f.cat);
    var dept = f.cat === "pet" ? null : f.dept;
    var existedBefore = S.data.items.some(function(it){ return it.cat === f.cat && it.name === name && !it.deleted; });
    upsertItem(f.cat, name, emoji, f.type, dept);
    if (!existedBefore) {
      var it = null;
      for (var i = 0; i < S.data.items.length; i++){
        if (S.data.items[i].cat === f.cat && S.data.items[i].name === name && !S.data.items[i].deleted) { it = S.data.items[i]; break; }
      }
      if (it) {
        if (f.type === "count") it.qty = Math.max(1, Number(f.qty) || 1);
        else it.gauge = Number(f.gauge);
        it.updatedAt = Date.now();
        persist(S.data);
      }
    }
    var favFullMsg = null;
    if (f.registerFavorite) {
      var favRes = addFavoriteIfPossible(f.cat, name, emoji, f.type, dept);
      if (!favRes.ok && favRes.reason === "full") favFullMsg = "いっぱいだぞう";
    }
    closeAddSheet();
    showToast(favFullMsg || "いれたぞう！", [], favFullMsg ? 2600 : 2000);
  }

  // 名前入力から学習辞書・食材絵文字辞書を引いて絵文字/タイプ/部門をサジェストする
  function trySuggest(formObj, name){
    var key = String(name || "").trim();
    if (!key) return;
    var known = S.data.dict[key] || FOOD_DICT[key];
    if (!known) return;
    if (known.emoji) formObj.emoji = known.emoji;
    if (known.type) formObj.type = known.type;
    if (formObj.cat !== "pet") {
      var validDepts = DEPTS[formObj.cat] || [];
      if (known.dept && validDepts.indexOf(known.dept) !== -1) formObj.dept = known.dept;
    }
  }

  // ─────────────────────────────────────────
  // 編集シート
  // ─────────────────────────────────────────
  function openEditSheet(id){
    var it = findItem(id);
    if (!it) return;
    S.editingId = id;
    S.editForm = {
      name: it.name, emoji: it.emoji, type: it.type,
      qty: it.qty || 1, gauge: it.gauge || 0, cat: it.cat, dept: it.dept
    };
    render();
  }
  function closeEditSheet(){ S.editingId = null; S.editForm = null; render(); }

  function saveEditItem(){
    var it = findItem(S.editingId);
    if (!it) return;
    var f = S.editForm;
    var name = (f.name || "").trim();
    if (!name) return;
    it.name = name;
    it.emoji = (f.emoji || "").trim() || defaultEmojiForCat(f.cat);
    it.type = f.type;
    it.cat = f.cat;
    it.dept = f.cat === "pet" ? null : f.dept;
    if (f.type === "count") {
      it.qty = Math.max(1, Number(f.qty) || 1);
      it.gauge = 0;
    } else {
      it.gauge = Number(f.gauge);
      it.qty = 0;
      if (it.gauge <= 1) addToShoppingIfNotExists(it.name, it.emoji, it.cat, it.dept);
    }
    it.updatedAt = Date.now();
    S.data.dict[it.name] = { emoji: it.emoji, type: it.type, cat: it.cat, dept: it.dept, updatedAt: Date.now() };
    persist(S.data);
    closeEditSheet();
  }

  // ─────────────────────────────────────────
  // 買い物リスト
  // ─────────────────────────────────────────
  function addShoppingManual(){
    var name = (S.shoppingInput || "").trim();
    if (!name) return;
    var known = S.data.dict[name];
    var cat = null, dept = null, emoji = "🛒";
    if (known) { emoji = known.emoji || emoji; cat = known.cat || null; dept = known.dept || null; }
    else if (FOOD_DICT[name]) { emoji = FOOD_DICT[name].emoji; cat = "fridge"; dept = FOOD_DICT[name].dept || null; }
    var added = addToShoppingIfNotExists(name, emoji, cat, dept);
    S.shoppingInput = "";
    render();
    if (added) showToast("メモしたぞう", [], 2000);
  }
  function toggleShoppingChecked(id){
    var s = null;
    for (var i = 0; i < S.data.shopping.length; i++){
      if (S.data.shopping[i].id === id && !S.data.shopping[i].deleted) { s = S.data.shopping[i]; break; }
    }
    if (!s) return;
    s.checked = !s.checked;
    s.updatedAt = Date.now();
    persist(S.data);
    render();
  }
  // 買い物リストの削除もtombstone方式(deleted:true + updatedAt更新)にする。
  function deleteShoppingItem(id){
    var s = null;
    for (var i = 0; i < S.data.shopping.length; i++){
      if (S.data.shopping[i].id === id && !S.data.shopping[i].deleted) { s = S.data.shopping[i]; break; }
    }
    if (!s) return;
    pushUndo();
    s.deleted = true;
    s.updatedAt = Date.now();
    persist(S.data);
    showToast("けしたぞう", [{ label:"もどす", action:"toast-undo" }], 3000);
  }
  // チェック済み一括削除もtombstone方式。配列からsplice/filterで取り除かず、
  // 該当レコードにdeleted:trueを立てるだけにする(他端末同期での復活防止)。
  function clearCheckedShopping(){
    var hasChecked = S.data.shopping.some(function(s){ return s.checked && !s.deleted; });
    if (!hasChecked) return;
    pushUndo();
    var now = Date.now();
    S.data.shopping.forEach(function(s){
      if (s.checked && !s.deleted) { s.deleted = true; s.updatedAt = now; }
    });
    persist(S.data);
    showToast("けしたぞう", [{ label:"もどす", action:"toast-undo" }], 3000);
  }
  function moveCheckedToStock(){
    var checked = S.data.shopping.filter(function(s){ return s.checked && !s.deleted; });
    if (!checked.length) return;
    pushUndo();
    var now = Date.now();
    checked.forEach(function(s){
      var known = S.data.dict[s.name];
      var cat = s.cat || (known && known.cat) || "fridge";
      var dept = s.dept || (known && known.dept) || (DEPTS[cat] ? DEPTS[cat][0] : null);
      if (cat === "pet") dept = null;
      var type = (known && known.type) || "count";
      upsertItem(cat, s.name, s.emoji || "🛒", type, dept);
      s.deleted = true;
      s.updatedAt = now;
    });
    persist(S.data);
    showToast("いれたぞう！", [{ label:"もどす", action:"toast-undo" }], 4000);
  }

  // ─────────────────────────────────────────
  // レシート取り込み(Phase 3): パーサ・推定・状態操作
  // ─────────────────────────────────────────
  // 金額表記の文字列("¥1,234※"等)から数値を取り出す
  function parseReceiptMoney(s){
    return parseInt(String(s).replace(/[¥￥,※\-·−]/g, ""), 10) || 0;
  }

  // ある1行が「無条件に捨てるノイズ行」かどうかを判定する。
  // ★割引/値引/売変/レジ袋を含む行、割引額そのもの(負の数だけの行)、単価注記(@571等)・
  // 値段変更の注記(★売変@714→等、→を含む行)、記号だけ・1文字だけの行(はぐれた"5"等)が対象。
  function isReceiptNoiseLine(line){
    if (RECEIPT_NOISE_WORDS.some(function(w){ return line.indexOf(w) !== -1; })) return true;
    if (RECEIPT_NEGATIVE_RE.test(line)) return true;
    if (line.indexOf("@") === 0 || line.indexOf("→") !== -1) return true;
    if (line.length === 1) return true;
    if (!/[0-9A-Za-zぁ-んァ-ヶ一-龠]/.test(line)) return true; // 英数・かな・漢字を含まない=記号だけ
    return false;
  }

  // レシートのLive Text生テキストを商品候補配列にパースする。
  // 戻り値: { date:"2026年07月27日"(無ければ""), items:[{raw, qty, price}] }
  //
  // v0.8.0で「商品名の行→次の金額行」という順序依存の逐次ペアリングを廃止し、
  // 分類→FIFO突き合わせの2段方式に書き直した。実機のLive Text出力は写真によって
  // 商品名と金額の行順が入れ替わったり(金額が先に来る)、商品コードだけの行が単独で
  // 挟まったりして崩れることがあり、旧方式(直前の行を見るだけ)では対応が丸ごとズレて
  // 取り込み漏れが発生していたため。
  //
  // 段1) 各行を分類する(打ち切りキーワードが出たらそこで処理終了):
  //   ・ノイズ → 無条件に捨てる(isReceiptNoiseLine。割引/売変/レジ袋/負の数/単価注記/1文字等)
  //   ・数量注記((@139✕2個)等) → 直前に出てきた商品名(lastNameRef)のqtyへ即反映
  //   ・確定金額行(※・内・¥付き) → moneyQueueへ
  //   ・商品名+金額が同じ行(ソフティモ2倍W12R ¥690内 等) → その場で確定してitemsへ
  //   ・曖昧な数字行(マーカー無しの数字だけ。商品コード単独行の可能性がある) → ambigQueueへ
  //   ・それ以外 → 先頭の商品コードを除去して商品名としてnameQueue・itemsへ(空になれば捨てる)
  //
  // 段2) 商品名キューと確定金額キューをFIFOで突き合わせる。ただし単純に配列の同じ添字同士を
  //   ペアリングすると、確定金額が付かない商品(★売変などで※が付かないケース。例:
  //   「ZLフリーザーM」の直後の金額行に※が無い)が1件挟まっただけで以降すべてズレて
  //   誤対応してしまう。そこで「次の商品名の行より前にある金額まで」という上限を設けて
  //   1商品につき先頭から1つずつ消費する(名前が先でも金額が先でも吸収される)。
  //   これでもなお金額が付かなかった商品名には、行位置が最も近い未使用の曖昧数字行を
  //   割り当てる(上のZLフリーザーMのケースはここで拾う)。近すぎず遠すぎる(5行超)場合は
  //   金額未確定のまま候補に残し、曖昧数字行の候補が1つも残っていない商品名は取り込み対象
  //   から外す(コード単独行やヘッダ文字列がここで自然に落ちる。maruetsu等)。
  function parseReceipt(text){
    var lines = String(text || "").split("\n");
    var items = [];       // 出現順の全候補(段2bで価格が付かなかったものは最後にfilterで除く)
    var nameQueue = [];   // 価格待ちの商品名(itemsと同じオブジェクト参照)
    var moneyQueue = [];  // 確定金額行 { value, lineIdx }
    var ambigQueue = [];  // 曖昧な数字行 { value, lineIdx }
    var lastNameRef = null; // 数量注記の適用先(直前に出た商品名/同一行確定分)

    for (var i = 0; i < lines.length; i++){
      var line = lines[i].trim();
      if (!line) continue;

      if (RECEIPT_CUTOFF_WORDS.some(function(w){ return line.indexOf(w) !== -1; })) break;
      if (isReceiptNoiseLine(line)) continue;

      var qtyMatch = line.match(RECEIPT_QTY_RE);
      if (qtyMatch) {
        if (lastNameRef) lastNameRef.qty = parseInt(qtyMatch[1], 10) || lastNameRef.qty;
        continue;
      }

      if (RECEIPT_MONEY_RE.test(line)) {
        moneyQueue.push({ value: parseReceiptMoney(line), lineIdx: i });
        continue;
      }

      var combo = line.match(RECEIPT_COMBINED_RE);
      if (combo) {
        var comboName = combo[1].trim().replace(RECEIPT_CODE_RE, "").trim();
        if (comboName) {
          var comboItem = { raw: comboName, qty: 1, price: parseReceiptMoney(combo[2]) };
          items.push(comboItem);
          lastNameRef = comboItem;
        }
        continue;
      }

      if (RECEIPT_AMBIGUOUS_RE.test(line)) {
        ambigQueue.push({ value: parseReceiptMoney(line), lineIdx: i });
        continue;
      }

      var name = line.replace(RECEIPT_CODE_RE, "").trim();
      if (!name) continue; // コード除去後に残りが空 → 商品行として扱わない
      var nameItem = { raw: name, qty: 1, price: null, lineIdx: i };
      items.push(nameItem);
      nameQueue.push(nameItem);
      lastNameRef = nameItem;
    }

    // 段2a: 確定金額キューとのFIFO突き合わせ(次の商品名の行を超えて奪わない)
    var mi = 0;
    for (var ni = 0; ni < nameQueue.length; ni++){
      var nm = nameQueue[ni];
      var nextLine = (ni + 1 < nameQueue.length) ? nameQueue[ni + 1].lineIdx : Infinity;
      if (mi < moneyQueue.length && moneyQueue[mi].lineIdx < nextLine) {
        nm.price = moneyQueue[mi].value;
        mi++;
      }
    }

    // 段2b: 金額が付かなかった商品名に、最も近い未使用の曖昧数字行を割り当てる
    var usedAmbig = {};
    nameQueue.forEach(function(nm2){
      if (nm2.price != null) return;
      var bestIdx = -1, bestDist = Infinity;
      ambigQueue.forEach(function(a, ai){
        if (usedAmbig[ai]) return;
        var d = Math.abs(a.lineIdx - nm2.lineIdx);
        if (d < bestDist) { bestDist = d; bestIdx = ai; }
      });
      if (bestIdx === -1) { nm2.drop = true; return; } // 曖昧候補が1つも残っていない→捨てる
      usedAmbig[bestIdx] = true;
      if (bestDist <= RECEIPT_AMBIGUOUS_MAX_DIST) nm2.price = ambigQueue[bestIdx].value;
      // 距離超過の場合は割り当てずに金額未確定のまま候補に残す(価格はUI上必須ではない)
    });

    items = items.filter(function(it){ return !it.drop; });

    var dateMatch = String(text || "").match(RECEIPT_DATE_RE);
    return { date: dateMatch ? dateMatch[0] : "", items: items };
  }

  // レーベンシュタイン距離(素直なDP)
  function levenshtein(a, b){
    var m = a.length, n = b.length;
    var dp = [];
    for (var i = 0; i <= m; i++){ dp.push([i]); }
    for (var j = 0; j <= n; j++){ dp[0][j] = j; }
    for (i = 1; i <= m; i++){
      for (j = 1; j <= n; j++){
        dp[i][j] = a[i - 1] === b[j - 1] ? dp[i - 1][j - 1] : 1 + Math.min(dp[i - 1][j - 1], dp[i - 1][j], dp[i][j - 1]);
      }
    }
    return dp[m][n];
  }

  // レシート表記の学習辞書キー用に正規化する(商品コード除去・空白除去・全角英数の半角化程度)
  function normalizeReceiptKey(raw){
    return String(raw || "")
      .replace(/^\d{2,4}\s*/, "")
      .replace(/\s+/g, "")
      .replace(/[Ａ-Ｚａ-ｚ０-９]/g, function(c){ return String.fromCharCode(c.charCodeAt(0) - 0xFEE0); });
  }

  // レシート表記(raw)から在庫アイテムを推定する。優先順位:
  // 1) 学習辞書(receiptDict)の完全一致 → 2) 学習辞書のあいまい一致(レーベンシュタイン距離2以下かつ
  // 文字数の30%以内) → 3) 既存の在庫アイテム名との包含判定 → 4) 内蔵の食材辞書(FOOD_DICT)との包含判定
  // → 5) 未知(null)。戻り値は {name,emoji,type,cat,dept} または {ignore:true} または null。
  function guessItemFor(raw){
    var key = normalizeReceiptKey(raw);
    var dict = S.data.receiptDict || {};
    if (Object.prototype.hasOwnProperty.call(dict, key)) return dict[key];

    var bestKey = null, bestDist = Infinity;
    Object.keys(dict).forEach(function(k){
      var d = levenshtein(key, k);
      var limit = Math.max(key.length, k.length) * 0.3;
      if (d <= 2 && d <= limit && d < bestDist) { bestDist = d; bestKey = k; }
    });
    if (bestKey) return dict[bestKey];

    // 包含判定は1文字キー("塩""魚""油"等)だと誤爆しやすいので2文字未満は対象から除く
    var invMatch = null;
    S.data.items.some(function(it){
      if (!it.name || it.name.length < 2 || it.deleted) return false;
      if (key.indexOf(it.name) !== -1 || (key.length >= 2 && it.name.indexOf(key) !== -1)) { invMatch = it; return true; }
      return false;
    });
    if (invMatch) return { name: invMatch.name, emoji: invMatch.emoji, type: invMatch.type, cat: invMatch.cat, dept: invMatch.dept };

    var foodMatch = null;
    Object.keys(FOOD_DICT).some(function(k){
      if (k.length < 2) return false;
      if (key.indexOf(k) !== -1 || (key.length >= 2 && k.indexOf(key) !== -1)) { foodMatch = k; return true; }
      return false;
    });
    if (foodMatch) {
      var fd = FOOD_DICT[foodMatch];
      return { name: foodMatch, emoji: fd.emoji, type: fd.type, cat: "fridge", dept: fd.dept };
    }

    return null; // 未知
  }

  function openReceiptSheet(){
    S.receiptOpen = true;
    S.receiptStep = "paste";
    S.receiptText = "";
    S.receiptParsed = null;
    S.receiptCandidates = [];
    S.receiptEmojiOpenIdx = null;
    S.addOpen = false;
    S.editingId = null;
    S.recipeOpen = false;
    render();
  }
  function closeReceiptSheet(){
    S.receiptOpen = false;
    S.receiptStep = "paste";
    S.receiptText = "";
    S.receiptParsed = null;
    S.receiptCandidates = [];
    S.receiptEmojiOpenIdx = null;
    render();
  }

  // 貼り付けたテキストをパースして候補リストを組み立てる
  function parseReceiptText(){
    var text = S.receiptText || "";
    if (!text.trim()) return;
    var parsed = parseReceipt(text);
    var cands = parsed.items.map(function(it){
      var guess = guessItemFor(it.raw);
      if (guess && guess.ignore) return null; // 「今後も無視」済みは候補に出さない
      var cat = (guess && guess.cat) || "fridge";
      var dept = (guess && guess.dept) || (cat === "pet" ? null : DEPTS[cat][0]);
      var type = (guess && guess.type) || "count";
      return {
        raw: it.raw,
        on: true,
        name: (guess && guess.name) || it.raw,
        emoji: (guess && guess.emoji) || defaultEmojiForCat(cat),
        type: type,
        qty: it.qty || 1,
        gauge: 3,
        cat: cat,
        dept: dept,
        isNew: !guess
      };
    }).filter(function(c){ return c; });
    S.receiptParsed = parsed;
    S.receiptCandidates = cands;
    S.receiptStep = "candidates";
    render();
  }

  // ショートカット連携(v0.8.0): iOSショートカットから「写真を撮る→テキスト認識→Safariで
  // このアプリを#receipt=<テキスト>付きで開く」という流れで、レシート取り込みシートを開いて
  // 貼り付け・パースまで自動で行う。
  // クエリ文字列(?receipt=)ではなくハッシュ(#receipt=)を使う理由: ハッシュはブラウザから
  // サーバーへ送信されないため、GitHub PagesのアクセスログにレシートOCRの中身(購入品目)が
  // 残らない。またService WorkerのfetchイベントはリクエストURLでキャッシュ照合するが、
  // ハッシュはリクエストに含まれないためキャッシュ動作にも影響しない。
  function applyReceiptShortcut(){
    var hash = location.hash || "";
    if (hash.indexOf("#receipt=") !== 0) return;
    var raw = hash.slice("#receipt=".length);
    // 消費したらすぐハッシュを消す(リロード・再訪問時に同じテキストで再実行されないように)
    history.replaceState(null, "", location.pathname + location.search);
    var text;
    try { text = decodeURIComponent(raw); } catch (e) { return; } // デコード失敗 → 何もしない
    if (!text.trim()) return; // 空文字 → 何もしない(通常起動のまま)
    openReceiptSheet();
    S.receiptText = text;
    parseReceiptText(); // そのまま「よみとるぞう」まで自動で進めて候補リストを表示する
  }

  // ONの候補だけを在庫へ確定する
  function submitReceiptCandidates(){
    var cands = (S.receiptCandidates || []).filter(function(c){ return c.on; });
    if (!cands.length) { closeReceiptSheet(); return; }
    pushUndo();
    var count = 0;
    cands.forEach(function(c){
      var name = (c.name || "").trim();
      if (!name) return;
      var emoji = (c.emoji || "").trim() || defaultEmojiForCat(c.cat);
      var dept = c.cat === "pet" ? null : c.dept;
      // 個数ものはqty回upsertして加算、残量ものは1回でたっぷり(3)に戻す
      var times = c.type === "count" ? Math.max(1, Number(c.qty) || 1) : 1;
      for (var i = 0; i < times; i++){ upsertItem(c.cat, name, emoji, c.type, dept); }
      // 買い物リストの同名は消し込む(tombstone方式。他端末同期での復活を防ぐ)
      var now = Date.now();
      S.data.shopping.forEach(function(s){
        if (s.name === name && s.cat === c.cat && !s.deleted) { s.deleted = true; s.updatedAt = now; }
      });
      // 学習辞書へ記録
      S.data.receiptDict[normalizeReceiptKey(c.raw)] = { name: name, emoji: emoji, type: c.type, cat: c.cat, dept: dept, updatedAt: Date.now() };
      count++;
    });
    persist(S.data);
    closeReceiptSheet();
    showToast(count + "個いれたぞう", [{ label:"もどす", action:"toast-undo" }], 4000, null, "./char-joy.png");
  }

  // ─────────────────────────────────────────
  // Phase 2: GAS同期
  // ─────────────────────────────────────────
  var SYNC_KEY = "aruzou-sync-v1";
  // SYNC.config = { url, token, enabled } はlocalStorage(SYNC_KEY)に保存する設定。
  // コードには絶対に直書きしない(GitHubの公開リポジトリに載るため)。
  var SYNC = {
    config: { url:"", token:"", enabled:false },
    syncing: false,        // 同期リクエスト中フラグ(多重実行防止)
    pendingSync: false,    // 同期中に起きた変更。完了後に必ず送り直す(捨てると変更が消える)
    debounceTimer: null,   // データ変更後のデバウンス予約タイマー
    applyingRemote: false  // サーバー受信結果を書き戻している最中はscheduleSyncを起動しない
  };

  // サーバーの結果をローカルへ取り込む際のレコード単位マージ。
  // POSTの往復中(数秒)にローカルで起きた変更はサーバーの応答に含まれないので、
  // 丸ごと置き換えると消える(「消したのに戻る」の原因)。updatedAtが新しい方を残す。
  function mergeRemoteRecords(localArr, remoteArr, keyOf){
    var localByKey = {};
    (localArr || []).forEach(function(r){ if (r) localByKey[keyOf(r)] = r; });
    var out = [];
    var used = {};
    (remoteArr || []).forEach(function(rem){
      if (!rem) return;
      var k = keyOf(rem);
      used[k] = true;
      var loc = localByKey[k];
      out.push(loc && Number(loc.updatedAt || 0) > Number(rem.updatedAt || 0) ? loc : rem);
    });
    // サーバーにまだ無いローカル分(往復中に追加された等)は落とさず残す
    (localArr || []).forEach(function(loc){
      if (loc && !used[keyOf(loc)]) out.push(loc);
    });
    return out;
  }

  function loadSyncConfig(){
    try {
      var raw = localStorage.getItem(SYNC_KEY);
      if (raw) {
        var c = JSON.parse(raw);
        if (c && typeof c === "object") {
          SYNC.config.url = typeof c.url === "string" ? c.url : "";
          SYNC.config.token = typeof c.token === "string" ? c.token : "";
          SYNC.config.enabled = !!c.enabled;
        }
      }
    } catch (e) {}
  }
  function persistSyncConfig(){
    try { localStorage.setItem(SYNC_KEY, JSON.stringify(SYNC.config)); }
    catch (e) { console.error("同期設定の保存に失敗", e); }
  }

  // ── dict/receiptDict/favorites ⇔ サーバーのdicts配列(kind+key方式)の相互変換 ──
  // kind: "food"=S.data.dict(食材学習辞書) / "receipt"=S.data.receiptDict(レシート学習辞書) /
  // "fav"=S.data.favorites(よく買うもの)。favoritesはid管理していないため key="<cat>|<name>"で一意化する。
  function dictsFromLocal(){
    var out = [];
    Object.keys(S.data.dict || {}).forEach(function(name){
      var e = S.data.dict[name] || {};
      out.push({
        kind:"food", key:name, name:name, emoji:e.emoji || "", type:e.type || "",
        cat:e.cat || "", dept:e.dept != null ? e.dept : null, ignore:false,
        updatedAt: e.updatedAt || Date.now(), deleted:false
      });
    });
    Object.keys(S.data.receiptDict || {}).forEach(function(key){
      var e = S.data.receiptDict[key] || {};
      out.push({
        kind:"receipt", key:key, name:e.name || "", emoji:e.emoji || "", type:e.type || "",
        cat:e.cat || "", dept:e.dept != null ? e.dept : null, ignore: !!e.ignore,
        updatedAt: e.updatedAt || Date.now(), deleted:false
      });
    });
    ["fridge", "daily", "pet"].forEach(function(cat){
      (S.data.favorites[cat] || []).forEach(function(f){
        out.push({
          kind:"fav", key: cat + "|" + f.name, name:f.name, emoji:f.emoji || "", type:f.type || "",
          cat:cat, dept: f.dept != null ? f.dept : null, ignore:false,
          updatedAt: f.updatedAt || Date.now(), deleted: !!f.deleted
        });
      });
    });
    return out;
  }
  // サーバーから返ってきたマージ済みdicts配列を S.data.dict/receiptDict/favorites に反映する
  // (全置き換え。クライアント側にマージロジックは持たない)。
  function applyDictsToLocal(dicts){
    var dict = {};
    var receiptDict = {};
    var favorites = { fridge:[], daily:[], pet:[] };
    (dicts || []).forEach(function(r){
      if (!r || !r.kind) return;
      if (r.kind === "food") {
        if (r.deleted) return; // food辞書はローカルに削除機能が無いため、来た場合は反映しないだけでよい
        dict[r.key] = { emoji:r.emoji, type:r.type, cat:r.cat, dept: r.dept != null ? r.dept : null, updatedAt: r.updatedAt || Date.now() };
      } else if (r.kind === "receipt") {
        if (r.deleted) return;
        receiptDict[r.key] = r.ignore
          ? { ignore:true, updatedAt: r.updatedAt || Date.now() }
          : { name:r.name, emoji:r.emoji, type:r.type, cat:r.cat, dept: r.dept != null ? r.dept : null, updatedAt: r.updatedAt || Date.now() };
      } else if (r.kind === "fav") {
        if (!favorites[r.cat]) return; // 想定外のcatは無視
        favorites[r.cat].push({
          name:r.name, emoji:r.emoji, type:r.type, dept: r.dept != null ? r.dept : null,
          updatedAt: r.updatedAt || Date.now(), deleted: !!r.deleted
        });
      }
    });
    S.data.dict = dict;
    S.data.receiptDict = receiptDict;
    S.data.favorites = favorites;
  }

  // データ変更のたびにpersist()から呼ばれる。3秒デバウンスして自動同期する。
  // 未設定/同期OFFなら何もしない(ローカル動作を邪魔しない)。サーバー受信結果を書き戻して
  // いる最中(applyingRemote)は呼ばない(無限ループ防止)。
  function scheduleSync(){
    if (SYNC.applyingRemote) return;
    if (!SYNC.config.enabled || !SYNC.config.url || !SYNC.config.token) return;
    if (SYNC.debounceTimer) clearTimeout(SYNC.debounceTimer);
    SYNC.debounceTimer = setTimeout(function(){
      SYNC.debounceTimer = null;
      runSync({ manual:false });
    }, 3000);
  }

  // pull+pushを1回のPOSTで行う。ローカルの全データ(items/shopping/dicts、tombstoneも含む)を
  // 送り、サーバーがマージした結果を丸ごと受け取ってローカルを置き換える。
  // opts.manual=true のときだけトースト表示する(自動同期は静かに済ませる)。
  function runSync(opts){
    opts = opts || {};
    var cfg = SYNC.config;
    if (!cfg.enabled || !cfg.url || !cfg.token) return;
    // 同期中に来た要求は捨てずに覚えておき、完了後に送り直す。
    // 捨てるとその間の操作(消費など)が永久にサーバーへ届かない。
    if (SYNC.syncing) { SYNC.pendingSync = true; return; }
    SYNC.syncing = true;
    var payload;
    try {
      payload = JSON.stringify({
        token: cfg.token,
        items: S.data.items,
        shopping: S.data.shopping,
        dicts: dictsFromLocal(),
        recipes: recipesForSync()
      });
    } catch (e) {
      SYNC.syncing = false;
      return;
    }
    fetch(cfg.url, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" }, // application/jsonにするとCORSプリフライトが飛びGASが応答できないため必須
      body: payload
    }).then(function(res){ return res.json(); }).then(function(json){
      SYNC.syncing = false;
      if (json && json.ok) {
        applySyncResult(json);
        if (opts.manual) showToast("そろえたぞう", [], 2200, null, "./char-joy.png");
      } else {
        console.warn("同期に失敗", json && json.error);
        if (opts.manual) showToast("同期できなかったぞう…", [], 2600);
      }
      flushPendingSync();
    }).catch(function(err){
      SYNC.syncing = false;
      console.warn("同期エラー", err);
      if (opts.manual) showToast("同期できなかったぞう(通信エラー)", [], 2600);
      flushPendingSync();
    });
  }

  // サーバーのマージ結果でローカルを置き換えて保存・再描画する
  // 同期中に溜まった変更を送り直す。捨てるとその変更は二度と送られない。
  function flushPendingSync(){
    if (!SYNC.pendingSync) return;
    SYNC.pendingSync = false;
    scheduleSync();
  }

  function applySyncResult(json){
    SYNC.applyingRemote = true;
    // dicts/recipesはローカル側もサーバー形式に直してから同じ土俵でマージする
    var localDicts = dictsFromLocal();
    var localRecipes = recipesForSync();
    try {
      S.data.items = mergeRemoteRecords(S.data.items, json.items, function(r){ return r.id; });
      S.data.shopping = mergeRemoteRecords(S.data.shopping, json.shopping, function(r){ return r.id; });
      applyDictsToLocal(mergeRemoteRecords(localDicts, json.dicts, function(r){ return r.kind + "|" + r.key; }));
      // json.recipesが無い(recipes未対応の古いサーバー)場合もmergeRemoteRecordsが空配列扱いするため落ちない
      S.data.recipes = applyRecipesToLocal(mergeRemoteRecords(localRecipes, json.recipes, function(r){ return r.id; }));
      persist(S.data);
    } finally {
      SYNC.applyingRemote = false;
    }
    render();
  }

  // ── 設定シート ──
  function openSettingsSheet(){
    S.settingsOpen = true;
    S.settingsForm = { url: SYNC.config.url || "", token: SYNC.config.token || "", enabled: !!SYNC.config.enabled };
    S.settingsTestResult = null;
    S.settingsBusy = false;
    S.addOpen = false;
    S.editingId = null;
    S.receiptOpen = false;
    S.recipeOpen = false;
    render();
  }
  function closeSettingsSheet(){
    S.settingsOpen = false;
    S.settingsForm = null;
    S.settingsTestResult = null;
    render();
  }
  // 編集中のフォーム内容をSYNC.configへ確定保存する
  function commitSettingsForm(){
    if (!S.settingsForm) return;
    SYNC.config.url = (S.settingsForm.url || "").trim();
    SYNC.config.token = (S.settingsForm.token || "").trim();
    SYNC.config.enabled = !!S.settingsForm.enabled;
    persistSyncConfig();
  }
  // 接続テスト: GETを叩いてok:trueが返るか確認する
  function testSyncConnection(){
    commitSettingsForm();
    var cfg = SYNC.config;
    if (!cfg.url || !cfg.token) {
      S.settingsTestResult = { ok:false, msg:"URLと合言葉を入力してね" };
      render();
      return;
    }
    S.settingsBusy = true;
    S.settingsTestResult = null;
    render();
    var sep = cfg.url.indexOf("?") === -1 ? "?" : "&";
    fetch(cfg.url + sep + "token=" + encodeURIComponent(cfg.token))
      .then(function(res){ return res.json(); })
      .then(function(json){
        S.settingsBusy = false;
        if (json && json.ok) {
          S.settingsTestResult = { ok:true, msg:"つながったぞう" };
        } else {
          S.settingsTestResult = { ok:false, msg:"つながらなかったぞう(" + ((json && json.error) || "不明なエラー") + ")" };
        }
        render();
      })
      .catch(function(err){
        S.settingsBusy = false;
        S.settingsTestResult = { ok:false, msg:"つながらなかったぞう(承認待ち、またはURL/通信を確認してね)" };
        render();
        console.warn("接続テストエラー", err);
      });
  }
  // 今すぐ同期: フォームの内容を確定保存してから手動同期する
  function syncNow(){
    commitSettingsForm();
    if (!SYNC.config.url || !SYNC.config.token) {
      S.settingsTestResult = { ok:false, msg:"URLと合言葉を入力してね" };
      render();
      return;
    }
    if (!SYNC.config.enabled) {
      S.settingsTestResult = { ok:false, msg:"同期がOFFになってるぞう" };
      render();
      return;
    }
    S.settingsBusy = true;
    render();
    runSync({ manual:true });
    // runSync自体は非同期でトースト表示するため、ボタンのbusy状態は簡易に少し後で解除する
    setTimeout(function(){ S.settingsBusy = false; render(); }, 1200);
  }

  // ─────────────────────────────────────────
  // マイ料理(Phase 4): レシピ登録・「作った」一括消費
  // ─────────────────────────────────────────
  // 材料は名前で持つため、消費時はcat:"fridge"限定・名前一致で現在の実在庫と突き合わせる
  // (削除済みtombstoneは除外)。日用品/リュクサクの同名アイテムを誤って拾わないようcat限定にする。
  function findFridgeItemByName(name){
    var items = S.data.items;
    for (var i = 0; i < items.length; i++){
      if (items[i].cat === "fridge" && items[i].name === name && !items[i].deleted) return items[i];
    }
    return null;
  }

  // 削除済み(tombstone)を除いたレシピ一覧
  function activeRecipes(){
    return (S.data.recipes || []).filter(function(r){ return !r.deleted; });
  }

  function openRecipeSheet(){
    S.recipeOpen = true;
    S.recipeView = "list";
    S.recipeForm = null;
    S.recipeIngredientInput = "";
    S.cookForm = null;
    S.addOpen = false;
    S.editingId = null;
    S.receiptOpen = false;
    S.settingsOpen = false;
    render();
  }
  function closeRecipeSheet(){
    S.recipeOpen = false;
    S.recipeView = "list";
    S.recipeForm = null;
    S.recipeIngredientInput = "";
    S.cookForm = null;
    render();
  }
  // シートは閉じずに一覧ビューへ戻る(登録/編集/確認画面の「戻る」用)
  function backToRecipeList(){
    S.recipeView = "list";
    S.recipeForm = null;
    S.recipeIngredientInput = "";
    S.cookForm = null;
    render();
  }

  function openRecipeNewForm(){
    S.recipeForm = { id:null, name:"", emoji:"🍳", ingredients:[] };
    S.recipeIngredientInput = "";
    S.recipeView = "edit";
    render();
  }
  function openRecipeEditForm(id){
    var r = null;
    for (var i = 0; i < S.data.recipes.length; i++){
      if (S.data.recipes[i].id === id && !S.data.recipes[i].deleted) { r = S.data.recipes[i]; break; }
    }
    if (!r) return;
    S.recipeForm = { id:r.id, name:r.name, emoji:r.emoji, ingredients: JSON.parse(JSON.stringify(r.ingredients || [])) };
    S.recipeIngredientInput = "";
    S.recipeView = "edit";
    render();
  }

  // 材料を1件追加する(同名の二重追加は無視)。個数ものは既定qty=1、残量ものはqtyを使わないので0。
  function recipeAddIngredient(name, type){
    var f = S.recipeForm;
    if (!f) return;
    var nm = String(name || "").trim();
    if (!nm) return;
    if (f.ingredients.some(function(ing){ return ing.name === nm; })) return;
    var t = type === "gauge" ? "gauge" : "count";
    f.ingredients.push({ name:nm, qty: t === "count" ? 1 : 0, type:t });
  }

  function saveRecipeForm(){
    var f = S.recipeForm;
    if (!f) return;
    var name = (f.name || "").trim();
    if (!name || !f.ingredients.length) return; // 名前必須・材料は1つ以上必須
    var emoji = (f.emoji || "").trim() || "🍳";
    var ingredients = f.ingredients.map(function(ing){
      return { name: ing.name, type: ing.type, qty: ing.type === "count" ? Math.max(1, Number(ing.qty) || 1) : 0 };
    });
    var now = Date.now();
    if (f.id) {
      var r = null;
      for (var i = 0; i < S.data.recipes.length; i++){ if (S.data.recipes[i].id === f.id) { r = S.data.recipes[i]; break; } }
      if (r) {
        r.name = name; r.emoji = emoji; r.ingredients = ingredients; r.updatedAt = now;
      }
    } else {
      S.data.recipes.push({ id:newId(), name:name, emoji:emoji, ingredients:ingredients, updatedAt:now, deleted:false });
    }
    persist(S.data);
    backToRecipeList();
    showToast("とうろくしたぞう", [], 2000);
  }

  // レシピ削除もtombstone方式(deleted:true + updatedAt更新)。他レコードと同じくUndo対応。
  function deleteRecipe(id){
    var r = null;
    for (var i = 0; i < S.data.recipes.length; i++){
      if (S.data.recipes[i].id === id && !S.data.recipes[i].deleted) { r = S.data.recipes[i]; break; }
    }
    if (!r) return;
    pushUndo();
    r.deleted = true;
    r.updatedAt = Date.now();
    persist(S.data);
    backToRecipeList();
    showToast("けしたぞう", [{ label:"もどす", action:"toast-undo" }], 3000);
  }

  // 材料名から絵文字を推定する(在庫アイテム→食材学習辞書→内蔵食材辞書→既定)。
  // 在庫に無い材料でも確認画面に何かしら絵文字を出すためのフォールバック。
  function guessEmojiForIngredientName(name){
    var known = S.data.dict[name];
    if (known && known.emoji) return known.emoji;
    var fd = FOOD_DICT[name];
    if (fd && fd.emoji) return fd.emoji;
    return "🍽";
  }

  // レシピの材料それぞれを現在の実在庫と突き合わせ、「作った」確認画面の行データを組み立てる。
  // ★在庫はマイナスにしないため、個数ものの消費数は在庫数(have)を上限にクランプする。
  function buildCookForm(recipe){
    var rows = (recipe.ingredients || []).map(function(ing){
      var it = findFridgeItemByName(ing.name);
      var mode = it ? it.type : ing.type; // 在庫の実際のtypeを優先(手動で個数⇔残量を変更した場合に追従)
      var emoji = it ? it.emoji : guessEmojiForIngredientName(ing.name);
      if (mode === "count") {
        var need = Math.max(1, Number(ing.qty) || 1);
        var have = (it && it.type === "count") ? (it.qty || 0) : 0;
        var missing = !it || it.type !== "count" || have <= 0;
        return {
          name: ing.name, emoji: emoji, type: "count",
          need: need, have: have,
          consume: missing ? 0 : Math.min(need, have),
          on: !missing,
          status: missing ? "missing" : (have < need ? "short" : "ok"),
          itemId: it ? it.id : null
        };
      }
      var gmissing = !it || it.type !== "gauge";
      return {
        name: ing.name, emoji: emoji, type: "gauge",
        have: gmissing ? 0 : (it.gauge || 0),
        gaugeChoice: "same", // 既定は「そのまま」(自動では減らさない)
        status: gmissing ? "missing" : "ok",
        itemId: it ? it.id : null
      };
    });
    return { recipeId: recipe.id, name: recipe.name, emoji: recipe.emoji, rows: rows };
  }

  function openRecipeCook(id){
    var r = null;
    for (var i = 0; i < S.data.recipes.length; i++){
      if (S.data.recipes[i].id === id && !S.data.recipes[i].deleted) { r = S.data.recipes[i]; break; }
    }
    if (!r) return;
    S.cookForm = buildCookForm(r);
    S.recipeView = "cook";
    render();
  }

  // その行が実際に消費対象かどうか(確定ボタンの活性判定・一括消費の対象判定の両方で使う)
  function cookRowActive(row){
    if (row.status === "missing") return false;
    if (row.type === "count") return !!row.on && row.consume > 0;
    return row.gaugeChoice !== "same";
  }
  function anyCookRowActive(){
    return !!(S.cookForm && S.cookForm.rows.some(cookRowActive));
  }

  // 確定(つかったぞう): 一括消費の前に1回だけpushUndo()する。個数ものが0になったらconsumeItemと
  // 同様にtombstone化+買い物リストへ自動追加、残量ものはtapGaugeのルール(1以下で自動追加)と揃える。
  function submitCook(){
    var cf = S.cookForm;
    if (!cf || !anyCookRowActive()) return;
    pushUndo();
    var now = Date.now();
    cf.rows.forEach(function(row){
      if (!cookRowActive(row)) return;
      if (row.type === "count") {
        var it = row.itemId ? findItem(row.itemId) : null;
        if (!it) return;
        var amount = Math.max(0, Math.min(row.consume, it.qty || 0)); // 念のため二重に在庫超過を防ぐ
        it.qty = (it.qty || 0) - amount;
        if (it.qty <= 0) {
          it.deleted = true;
          it.updatedAt = now;
          addToShoppingIfNotExists(it.name, it.emoji, it.cat, it.dept);
        } else {
          it.updatedAt = now;
        }
      } else {
        var git = row.itemId ? findItem(row.itemId) : null;
        if (!git) return;
        git.gauge = row.gaugeChoice === "empty" ? 0 : Math.max(0, (git.gauge || 0) - 1);
        git.updatedAt = now;
        if (git.gauge <= 1) addToShoppingIfNotExists(git.name, git.emoji, git.cat, git.dept);
      }
    });
    persist(S.data);
    closeRecipeSheet();
    showToast("つかったぞう", [{ label:"もどす", action:"toast-undo" }], 4000, null, "./char-joy.png");
  }

  // ── 同期用: recipes ⇔ サーバー形式(ingredientsは1セルに入れるためJSON文字列)の相互変換 ──
  function recipesForSync(){
    return (S.data.recipes || []).map(function(r){
      var ingStr;
      try { ingStr = JSON.stringify(r.ingredients || []); } catch (e) { ingStr = "[]"; }
      return { id:r.id, name:r.name || "", emoji:r.emoji || "", ingredients:ingStr, updatedAt:r.updatedAt || Date.now(), deleted: !!r.deleted };
    });
  }
  // サーバー形式(ingredientsが文字列)からローカル形式(配列)へ戻す。パース失敗時は空配列にして
  // 落とさない(壊れたデータでアプリごと止まらないようにする)。
  function applyRecipesToLocal(list){
    return (list || []).map(function(r){
      var ingredients = [];
      if (typeof r.ingredients === "string") {
        try { ingredients = JSON.parse(r.ingredients) || []; } catch (e) { ingredients = []; }
      } else if (Array.isArray(r.ingredients)) {
        ingredients = r.ingredients; // 念のため既に配列で来た場合もそのまま受け付ける
      }
      if (!Array.isArray(ingredients)) ingredients = [];
      return { id:r.id, name:r.name || "", emoji:r.emoji || "", ingredients:ingredients, updatedAt:r.updatedAt || Date.now(), deleted: !!r.deleted };
    });
  }

  // ─────────────────────────────────────────
  // 描画: 小物
  // ─────────────────────────────────────────
  // img省略時は従来どおりchar-worried.png(こまり顔)。買い物リスト空状態など「考えてる」方が
  // 自然な箇所ではchar-thinking.pngを呼び出し側から渡す(v0.7.1)。
  function emptyStateHtml(msg, img){
    var src = img || "./char-worried.png";
    var alt = (img === "./char-thinking.png") ? "考えちゅうのあるぞう" : "こまり顔のあるぞう";
    return '<div class="empty-state"><img class="empty-char-img" src="' + src + '" alt="' + alt + '" width="112" height="140"><div class="empty-msg">' + esc(msg) + '</div></div>';
  }

  // idxを渡すと data-idx 属性を付ける(レシート候補など、配列インデックスで対象を特定する場合用)
  function gaugeSelectorHtml(action, current, idx){
    var levels = [{v:3,l:"たっぷり"},{v:2,l:"半分"},{v:1,l:"少ない"},{v:0,l:"なし"}];
    return '<div class="gauge-select">' + levels.map(function(lv){
      return '<button class="gauge-opt' + (current === lv.v ? ' active' : '') + '" data-action="' + action + '"' +
        (idx != null ? ' data-idx="' + idx + '"' : '') + ' data-g="' + lv.v + '">' + lv.l + '</button>';
    }).join('') + '</div>';
  }

  // 個数もの(type:"count")の1行を描画する。名前+絵文字列を横1段にまとめ、リード絵文字は
  // 右に同じ絵文字が並ぶため省く(名前ブロックの幅を稼ぐ)。名前タップ=編集、絵文字タップ=消費。
  function renderItemRow(it){
    var flashClass = (S.flashId === it.id) ? ' flash' : '';
    if (it.type === "count") {
      var head = '<div class="item-head" data-action="edit-item" data-id="' + it.id + '">' +
        '<span class="item-name">' + esc(it.name) + '</span>' +
      '</div>';
      var qty = it.qty || 0;
      var shown = Math.min(qty, 10);
      var btns = "";
      for (var i = 0; i < shown; i++){
        btns += '<button class="emoji-tap" data-action="consume-item" data-id="' + it.id + '">' + emojiHTML(it.emoji, 'ce-16') + '</button>';
      }
      var overflow = qty > 10 ? '<button class="emoji-badge" data-action="consume-item" data-id="' + it.id + '">×' + qty + '</button>' : "";
      var body = '<div class="emoji-row">' + btns + overflow + '</div>';
      return '<div class="item-card item-card-count' + flashClass + '">' + head + body + '</div>';
    } else {
      // 残量もの(type:"gauge")はリード絵文字を残す(絵文字が並ばず何の品か分からなくなるため)。
      // 2列グリッド表示時は幅が厳しいため、ラベル文字(たっぷり/半分/少ない/なし)は省いてドットのみ表示
      // (代わりにtitle属性でラベルを保持)。タップで1段階減る(gauge-tap)・44pxのタップ領域は維持。
      var g = it.gauge || 0;
      var label = g === 3 ? "たっぷり" : g === 2 ? "半分" : g === 1 ? "少ない" : "なし";
      var headG = '<div class="item-head" data-action="edit-item" data-id="' + it.id + '">' +
        '<span class="item-emoji-lead">' + emojiHTML(it.emoji, 'ce-20') + '</span>' +
        '<span class="item-name">' + esc(it.name) + '</span>' +
      '</div>';
      var dots = "";
      for (var j = 0; j < 3; j++) dots += (j < g ? "●" : "○");
      var bodyG = '<button class="gauge-row" data-action="gauge-tap" data-id="' + it.id + '" title="' + esc(label) + '">' +
        '<span class="gauge-dots">' + dots + '</span>' +
      '</button>';

  function renderStockTab(cat){
    var items = S.data.items.filter(function(it){ return it.cat === cat && !it.deleted; });
    var addBtn = '<button class="add-btn" data-action="open-add">＋ 追加</button>';
    // マイ料理(Phase 4)の入口。買い物リストタブの「🧾レシート取り込み」と対称の位置づけで
    // 冷蔵庫タブの上部にのみ置く(材料の突き合わせがcat:"fridge"限定のため)。
    var recipeBtn = cat === "fridge" ? '<button class="recipe-btn" data-action="recipe-open">🍳 マイ料理</button>' : '';
    if (!items.length) {
      return '<div class="tab-body">' + recipeBtn + addBtn + emptyStateHtml("なんにもないぞう…") + '</div>';
    }
    var sections = "";
    if (cat === "pet") {
      sections = '<div class="section">' + renderSectionItems(items) + '</div>';
    } else if (cat === "fridge") {
      // 冷蔵庫タブは部門ごとに色付きの棚/引き出し風コンテナで包む(FRIDGE_DEPT_DECOR参照)
      DEPTS[cat].forEach(function(dept){
        var list = items.filter(function(it){ return it.dept === dept; });
        if (!list.length) return;
        var decor = FRIDGE_DEPT_DECOR[dept] || { cls:"", icon:"" };
        sections += '<div class="section fridge-section ' + decor.cls + '">' +
          '<div class="fridge-section-title"><span>' + decor.icon + ' ' + esc(dept) + '</span><span class="handle"></span></div>' +
          renderSectionItems(list) +
        '</div>';
      });
    } else {
      DEPTS[cat].forEach(function(dept){
        var list = items.filter(function(it){ return it.dept === dept; });
        if (!list.length) return;
        sections += '<div class="section">' +
          '<div class="section-title">' + esc(dept) + '</div>' +
          renderSectionItems(list) +
        '</div>';

      '<span class="shopping-emoji">' + emojiHTML(s.emoji || '🛒', 'ce-18') + '</span>' +

  function renderShoppingTab(){
    var list = S.data.shopping.filter(function(s){ return !s.deleted; });
    var receiptBtn = '<button class="receipt-btn" data-action="receipt-open">🧾 レシート取り込み</button>';
    var inputRow = '<div class="shopping-add-row">' +
      '<input class="field" type="text" placeholder="かうものの名前" data-field="shopping-input" value="' + esc(S.shoppingInput || '') + '">' +
      '<button class="add-btn small" data-action="shopping-add">＋</button>' +
    '</div>';
    var settingsLink = '<button class="settings-entry" data-action="settings-open">⚙️ 設定(iPhone同期)</button>';

    if (!list.length) {
      return '<div class="tab-body">' + receiptBtn + inputRow + emptyStateHtml("かうものはないぞう！", "./char-thinking.png") + settingsLink + '</div>';
    }

    function groupKey(cat, dept){ return (cat || "none") + "|" + (dept || "none"); }
    var groups = {};
    list.forEach(function(s){
      var k = groupKey(s.cat, s.dept);
      if (!groups[k]) groups[k] = [];
      groups[k].push(s);
    });
    var orderedKeys = [];
    ["fridge", "daily"].forEach(function(cat){
      DEPTS[cat].forEach(function(dept){
        var k = groupKey(cat, dept);
        if (groups[k]) orderedKeys.push(k);
      });
    });
    var petKey = groupKey("pet", null);
    if (groups[petKey]) orderedKeys.push(petKey);
    var noneKey = groupKey(null, null);
    if (groups[noneKey]) orderedKeys.push(noneKey);
    Object.keys(groups).forEach(function(k){
      if (orderedKeys.indexOf(k) === -1) orderedKeys.push(k);
    });

    var sections = orderedKeys.map(function(k){
      var arr = groups[k];
      var parts = k.split("|");
      var cat = parts[0] === "none" ? null : parts[0];
      var dept = parts[1] === "none" ? null : parts[1];
      var title = dept ? dept : (cat ? CAT_LABELS[cat] : "そのほか");
      return '<div class="section"><div class="section-title">' + esc(title) + '</div>' +
        '<div class="item-list">' + arr.map(renderShoppingRow).join('') + '</div></div>';
    }).join('');

    var hasChecked = list.some(function(s){ return s.checked; });
    var actions = '<div class="shopping-actions">' +
      '<button class="btn-outline" data-action="shopping-clear-checked"' + (hasChecked ? '' : ' disabled') + '>チェック済みをまとめて消す</button>' +
      '<button class="btn-primary" data-action="shopping-move-to-stock"' + (hasChecked ? '' : ' disabled') + '>チェック済みを在庫に入れる</button>' +
    '</div>';

    return '<div class="tab-body">' + receiptBtn + inputRow + sections + actions + settingsLink + '</div>';
  }

            '</div>' +
          '</div>' +
          '<div class="sync-status' + resultCls + '">' + resultHtml + '</div>' +
        '</div>' +
        '<div class="sheet-actions">' +
          '<button class="btn-outline" data-action="settings-test"' + (busy ? ' disabled' : '') + '>接続テスト</button>' +
          '<button class="btn-primary" data-action="settings-sync-now"' + (busy ? ' disabled' : '') + '>今すぐ同期</button>' +
        '</div>' +
        '<div class="settings-version">あるぞう v' + esc(APP_VERSION) + '</div>' +
      '</div>';
  }

  // ─────────────────────────────────────────
  // 描画: マイ料理シート(Phase 4)
  // ─────────────────────────────────────────
  function renderRecipeListHtml(){
    var recipes = activeRecipes();
    var addBtn = '<button class="add-btn" data-action="recipe-add-new">＋ 新しい料理</button>';
    if (!recipes.length) {
      return '<div class="sheet-body">' + addBtn + emptyStateHtml("まだ料理がないぞう") + '</div>';
    }
    var grid = recipes.map(function(r){
      return '<div class="recipe-card">' +
        '<button class="recipe-card-main" data-action="recipe-cook-open" data-id="' + r.id + '">' +
          '<span class="recipe-card-emoji">' + emojiHTML(r.emoji, 'ce-32') + '</span>' +
          '<span class="recipe-card-name">' + esc(r.name) + '</span>' +
        '</button>' +
        '<button class="recipe-card-edit" data-action="recipe-edit-open" data-id="' + r.id + '" title="編集">✎</button>' +
      '</div>';
    }).join('');
    return '<div class="sheet-body">' + addBtn + '<div class="recipe-grid">' + grid + '</div></div>';
  }

  // 材料ピッカー1件分のチップ(在庫アイテム or よく買うもの)。data-typeは追加時の既定タイプに使う。
  function renderRecipeEditHtml(){
    var f = S.recipeForm;
    var seen = {};
    var known = [];
    S.data.items.filter(function(it){ return it.cat === "fridge" && !it.deleted; }).forEach(function(it){
      if (!seen[it.name]) { seen[it.name] = true; known.push({ name:it.name, emoji:it.emoji, type:it.type }); }
    });
    activeFavorites("fridge").forEach(function(fv){
      if (!seen[fv.name]) { seen[fv.name] = true; known.push({ name:fv.name, emoji:fv.emoji, type:fv.type }); }
    });
    var already = {};
    f.ingredients.forEach(function(ing){ already[ing.name] = true; });
    var pickList = known.filter(function(k){ return !already[k.name]; });
    var pickHtml = pickList.length
      ? pickList.map(function(k){
          return '<button class="recipe-pick-chip" data-action="recipe-ing-add-known" data-name="' + esc(k.name) + '" data-type="' + esc(k.type) + '">' +
            emojiHTML(k.emoji, 'ce-18') + '<span>' + esc(k.name) + '</span></button>';
        }).join('')
      : '<div class="recipe-pick-empty">冷蔵庫の在庫・よく買うものが無いぞう。下から手入力してね</div>';

    var ingListHtml = f.ingredients.length
      ? f.ingredients.map(function(ing, idx){
          var ctrl = ing.type === "count"
            ? '<div class="stepper"><button class="stepper-btn" data-action="recipe-ing-qty-delta" data-idx="' + idx + '" data-delta="-1">−</button>' +
                '<span class="stepper-val">' + ing.qty + '</span>' +
                '<button class="stepper-btn" data-action="recipe-ing-qty-delta" data-idx="' + idx + '" data-delta="1">＋</button></div>'
            : '<span class="recipe-ing-gauge-label">使う</span>';
          return '<div class="recipe-ing-row">' +
            '<span class="recipe-ing-name">' + esc(ing.name) + '</span>' +
            '<div class="segmented recipe-ing-seg">' +
              '<button class="seg-btn' + (ing.type === "count" ? ' active' : '') + '" data-action="recipe-ing-set-type" data-idx="' + idx + '" data-type="count">個数</button>' +
              '<button class="seg-btn' + (ing.type === "gauge" ? ' active' : '') + '" data-action="recipe-ing-set-type" data-idx="' + idx + '" data-type="gauge">残量</button>' +
            '</div>' +
            ctrl +
            '<button class="x-btn" data-action="recipe-ing-remove" data-idx="' + idx + '">×</button>' +
          '</div>';
        }).join('')
      : emptyStateHtml("材料をえらんでね");

    return '' +
      '<div class="sheet-body">' +
        '<div class="sheet-label">名前</div>' +
        '<input class="field" type="text" placeholder="料理の名前" data-field="recipe-name" value="' + esc(f.name) + '">' +
        '<div class="sheet-label">絵文字</div>' +
        '<input class="field emoji-input" type="text" placeholder="絵文字を入力 または下から選択" data-field="recipe-emoji-custom" value="' + esc(f.emoji) + '">' +
        renderEmojiGroupsHtml(f.emoji, "recipe-set-emoji") +
        '<div class="sheet-label">材料(在庫・よく買うものから選ぶ)</div>' +
        '<div class="recipe-pick-grid">' + pickHtml + '</div>' +
        '<div class="recipe-ing-add-row">' +
          '<input class="field" type="text" placeholder="材料名を手入力" data-field="recipe-ing-input" value="' + esc(S.recipeIngredientInput || '') + '">' +
          '<button class="add-btn small" data-action="recipe-ing-add-custom">＋</button>' +
        '</div>' +
        '<div class="sheet-label">えらんだ材料</div>' +
        '<div class="recipe-ing-list">' + ingListHtml + '</div>' +
      '</div>' +
      '<div class="sheet-actions">' +
        (f.id ? '<button class="delete-link" data-action="recipe-delete">削除</button>' : '') +
        '<button class="btn-primary" data-action="recipe-save"' + (f.ingredients.length ? '' : ' disabled') + '>保存</button>' +
      '</div>';
  }

  // 「作った」確認画面の1材料分。個数ものは在庫との突き合わせ結果(ok/short/missing)を文言で明示し、
  // 残量ものは3択(そのまま/1段階減った/使い切った)をワンタップで選ばせる。
  function renderCookRowHtml(row, idx){
    var toggleOn = row.type === "count" && row.status !== "missing" && row.on;
    var toggleHtml = row.type === "count"
      ? '<button class="receipt-toggle' + (toggleOn ? ' on' : '') + '" data-action="cook-toggle-on" data-idx="' + idx + '"' +
          (row.status === "missing" ? ' disabled' : '') + '>' + (toggleOn ? '✓' : '') + '</button>'
      : '<span class="receipt-toggle' + (row.status !== "missing" && row.gaugeChoice !== "same" ? ' on' : '') + '">' +
          (row.status !== "missing" && row.gaugeChoice !== "same" ? '✓' : '') + '</span>';

    var msg;
    if (row.status === "missing") {
      msg = esc(row.name) + ' → 在庫にありません（スキップ）';
    } else if (row.type === "count") {
      msg = row.status === "short"
        ? esc(row.name) + ' ×' + row.need + ' → 在庫' + row.have + '個です。' + row.have + '個だけ消費'
        : esc(row.name) + ' ×' + row.need + ' → 在庫' + row.have + '個';
    } else {
      var gLabel = row.have === 3 ? "たっぷり" : row.have === 2 ? "半分" : row.have === 1 ? "少ない" : "なし";
      msg = esc(row.name) + ' → 在庫「' + gLabel + '」';
    }

    var ctrl = "";
    if (row.status !== "missing") {
      if (row.type === "count") {
        ctrl = '<div class="cook-row-ctrl"><div class="stepper">' +
          '<button class="stepper-btn" data-action="cook-consume-delta" data-idx="' + idx + '" data-delta="-1">−</button>' +
          '<span class="stepper-val">' + row.consume + '</span>' +
          '<button class="stepper-btn" data-action="cook-consume-delta" data-idx="' + idx + '" data-delta="1">＋</button>' +
        '</div></div>';
      } else {
        var opts = [{ v:"same", l:"そのまま" }, { v:"one", l:"1段階減った" }, { v:"empty", l:"使い切った" }];
        ctrl = '<div class="cook-row-ctrl"><div class="gauge-select">' + opts.map(function(o){
          return '<button class="gauge-opt' + (row.gaugeChoice === o.v ? ' active' : '') + '" data-action="cook-gauge-choice" data-idx="' + idx + '" data-choice="' + o.v + '">' + o.l + '</button>';
        }).join('') + '</div></div>';
      }
    }

    return '<div class="cook-row ' + row.status + '">' +
      '<div class="cook-row-top">' +
        toggleHtml +
        '<span class="cook-row-emoji">' + emojiHTML(row.emoji, 'ce-20') + '</span>' +
        '<span class="cook-row-name">' + esc(row.name) + '</span>' +
      '</div>' +
      '<div class="cook-row-msg ' + row.status + '">' + msg + '</div>' +
      ctrl +
    '</div>';
  }

  function renderRecipeCookHtml(){
    var cf = S.cookForm;
    if (!cf) return '';
    var rowsHtml = cf.rows.map(function(row, idx){ return renderCookRowHtml(row, idx); }).join('');
    var active = anyCookRowActive();
    return '' +
      '<div class="sheet-body">' +
        '<div class="cook-summary">材料をたしかめて、消費する分をきめてね</div>' +
        rowsHtml +
      '</div>' +
      '<div class="sheet-actions">' +
        '<button class="btn-primary" data-action="cook-confirm"' + (active ? '' : ' disabled') + '>つかったぞう</button>' +
      '</div>';
  }

  function renderRecipeSheet(){
    var titleHtml;
    if (S.recipeView === "edit") titleHtml = esc((S.recipeForm && S.recipeForm.id) ? "料理を編集" : "あたらしい料理");
    else if (S.recipeView === "cook") titleHtml = S.cookForm ? (emojiHTML(S.cookForm.emoji, 'ce-20') + ' ' + esc(S.cookForm.name)) : "作った";
    else titleHtml = "🍳 マイ料理";
    var showBack = S.recipeView !== "list";
    var body;
    if (S.recipeView === "edit" && S.recipeForm) body = renderRecipeEditHtml();
    else if (S.recipeView === "cook" && S.cookForm) body = renderRecipeCookHtml();
    else body = renderRecipeListHtml();
    return '' +
      '<div class="sheet-backdrop" data-action="recipe-close"></div>' +
      '<div class="sheet">' +
        '<div class="sheet-head">' +
          (showBack ? '<button class="sheet-back" data-action="recipe-back">‹</button>' : '<span></span>') +
          '<span>' + titleHtml + '</span>' +
          '<button class="sheet-close" data-action="recipe-close">×</button>' +
        '</div>' +
        body +
      '</div>';
  }

  // ─────────────────────────────────────────
  // 全体描画
  // ─────────────────────────────────────────
  function render(){
    var app = document.getElementById("app");
    if (!S.data) { app.innerHTML = ""; return; }

    // 全再描画方式だとシート(.sheet)が毎回作り直され、scrollTopが0にリセットされてしまう。
    // 描画前にシート/ページのスクロール位置を保存し、描画後に復元して「勝手に上へ戻る」のを防ぐ。
    var prevSheet = app.querySelector(".sheet");
    var savedSheetScrollTop = prevSheet ? prevSheet.scrollTop : 0;
    var savedPageScrollTop = window.pageYOffset || document.documentElement.scrollTop || document.body.scrollTop || 0;

    var body;
    if (S.tab === "fridge") body = renderStockTab("fridge");
    else if (S.tab === "daily") body = renderStockTab("daily");
    else if (S.tab === "pet") body = renderStockTab("pet");
    else body = renderShoppingTab();

    app.innerHTML =
      renderHeader() +
      body +
      renderTabBar() +
      renderToast() +
      (S.addOpen && S.addForm ? renderAddSheet() : '') +
      (S.editingId && S.editForm ? renderEditSheet() : '') +
      (S.receiptOpen ? renderReceiptSheet() : '') +
      (S.settingsOpen && S.settingsForm ? renderSettingsSheet() : '') +
      (S.recipeOpen ? renderRecipeSheet() : '');

    var newSheet = app.querySelector(".sheet");
    if (newSheet) newSheet.scrollTop = savedSheetScrollTop;
    if (savedPageScrollTop) window.scrollTo(0, savedPageScrollTop);
  }

  // ─────────────────────────────────────────
  // イベント委譲
  // ─────────────────────────────────────────
  // テキスト入力: フォーカスを失わないようここではrender()を呼ばない
  function handleInput(e){
    var el = e.target;
    var field = el.dataset.field;
    if (!field) return;
    switch (field) {
      case "add-name": S.addForm.name = el.value; S.addForm.nameAuto = false; break;
      case "add-emoji-custom": S.addForm.emoji = el.value; break;
      case "edit-name": S.editForm.name = el.value; break;
      case "edit-emoji-custom": S.editForm.emoji = el.value; break;
      case "shopping-input": S.shoppingInput = el.value; break;
      case "receipt-text": S.receiptText = el.value; break;
      case "rc-name": {
        var ridx = Number(el.dataset.idx);
        if (S.receiptCandidates[ridx]) S.receiptCandidates[ridx].name = el.value;
        break;
      }
      case "settings-url": if (S.settingsForm) S.settingsForm.url = el.value; break;
      case "settings-token": if (S.settingsForm) S.settingsForm.token = el.value; break;
      case "recipe-name": if (S.recipeForm) S.recipeForm.name = el.value; break;
      case "recipe-emoji-custom": if (S.recipeForm) S.recipeForm.emoji = el.value; break;
      case "recipe-ing-input": S.recipeIngredientInput = el.value; break;
    }
  }

  // select要素の変更: 選択確定後なのでrender()して問題ない
  function handleChange(e){
    var el = e.target;
    var field = el.dataset.field;
    if (!field) return;
    switch (field) {
      case "add-dept": S.addForm.dept = el.value; render(); break;
      case "edit-dept": S.editForm.dept = el.value; render(); break;
      case "add-fav-checkbox": S.addForm.registerFavorite = !!el.checked; break;
      case "edit-cat": {
        var newCat = el.value;
        S.editForm.cat = newCat;
        S.editForm.dept = newCat === "pet" ? null : DEPTS[newCat][0];
        render();
        break;
      }
      case "rc-cat": {
        var cidx = Number(el.dataset.idx);
        var cand = S.receiptCandidates[cidx];
        if (cand) {
          cand.cat = el.value;
          cand.dept = cand.cat === "pet" ? null : DEPTS[cand.cat][0];
        }
        render();
        break;
      }
      case "rc-dept": {
        var didx = Number(el.dataset.idx);
        if (S.receiptCandidates[didx]) S.receiptCandidates[didx].dept = el.value;
        render();
        break;
      }
    }
  }

  // 名前入力欄からフォーカスが外れたら学習辞書/食材辞書からサジェストを反映する
  function handleFocusOut(e){
    var el = e.target;
    var field = el.dataset && el.dataset.field;
    if (field === "add-name") { trySuggest(S.addForm, S.addForm.name); render(); }
    else if (field === "edit-name") { trySuggest(S.editForm, S.editForm.name); render(); }
    else if (field === "settings-url" || field === "settings-token") { commitSettingsForm(); }
  }

  function handleKeydown(e){
    var el = e.target;
    if (el && el.dataset && el.dataset.field === "shopping-input" && e.key === "Enter") {
      e.preventDefault();
      addShoppingManual();
    }
  }

  function handleClick(e){
    var el = e.target.closest("[data-action]");
    if (!el) return;
    var action = el.dataset.action;
    switch (action) {
      case "set-tab":
        S.tab = el.dataset.tab; S.addOpen = false; S.editingId = null; S.receiptOpen = false; S.settingsOpen = false; S.recipeOpen = false; render(); break;
      case "open-add": openAddSheet(); break;
      case "close-add": closeAddSheet(); break;
      case "close-edit": closeEditSheet(); break;
      case "edit-item": openEditSheet(el.dataset.id); break;
      case "consume-item": consumeItem(el.dataset.id); break;
      case "gauge-tap": tapGauge(el.dataset.id); break;
      case "add-preset": {
        var pname = el.dataset.name;
        var preset = null;
        var list = activeFavorites(S.addForm.cat);
        for (var i = 0; i < list.length; i++){ if (list[i].name === pname) { preset = list[i]; break; } }
        if (preset) addPreset(S.addForm.cat, preset);
        break;
      }
      case "toggle-favorites-edit": S.favoritesEditMode = !S.favoritesEditMode; render(); break;
      case "favorite-delete": deleteFavorite(el.dataset.cat, el.dataset.name); break;
      case "add-set-emoji": {
        var af = S.addForm;
        var newEmoji = el.dataset.emoji;
        var currentName = (af.name || "").trim();
        var isEmpty = currentName === "";
        var isStaleAuto = af.nameAuto && currentName === af.autoNameValue;
        if (isEmpty || isStaleAuto) {
          var repName = EMOJI_TO_NAME[newEmoji];
          if (repName) {
            af.name = repName;
            af.nameAuto = true;
            af.autoNameValue = repName;
            trySuggest(af, repName);
          }
        }
        af.emoji = newEmoji;
        render();
        break;
      }
      case "edit-set-emoji": S.editForm.emoji = el.dataset.emoji; render(); break;
      case "add-set-type": S.addForm.type = el.dataset.type; render(); break;
      case "edit-set-type": S.editForm.type = el.dataset.type; render(); break;
      case "add-qty-delta":
        S.addForm.qty = Math.max(1, (S.addForm.qty || 1) + Number(el.dataset.delta)); render(); break;
      case "edit-qty-delta":
        S.editForm.qty = Math.max(1, (S.editForm.qty || 1) + Number(el.dataset.delta)); render(); break;
      case "add-set-gauge": S.addForm.gauge = Number(el.dataset.g); render(); break;
      case "edit-set-gauge": S.editForm.gauge = Number(el.dataset.g); render(); break;
      case "add-submit": submitAddForm(); break;
      case "edit-save": saveEditItem(); break;
      case "edit-delete": deleteItem(S.editingId); break;
      case "shopping-add": addShoppingManual(); break;
      case "shopping-toggle": toggleShoppingChecked(el.dataset.id); break;
      case "shopping-delete": deleteShoppingItem(el.dataset.id); break;
      case "shopping-clear-checked": clearCheckedShopping(); break;
      case "shopping-move-to-stock": moveCheckedToStock(); break;
      case "toast-undo": doUndo(); break;
      case "toast-add-shopping": {
        if (S.toast && S.toast.data) {
          var d = S.toast.data;
          addToShoppingIfNotExists(d.name, d.emoji, d.cat, d.dept);
        }
        hideToast();
        showToast("メモしたぞう", [], 2000);
        break;
      }
      case "receipt-open": openReceiptSheet(); break;
      case "receipt-close": closeReceiptSheet(); break;
      case "receipt-parse": parseReceiptText(); break;
      case "receipt-confirm": submitReceiptCandidates(); break;
      case "rc-toggle-on": {
        var idx1 = Number(el.dataset.idx);
        if (S.receiptCandidates[idx1]) S.receiptCandidates[idx1].on = !S.receiptCandidates[idx1].on;
        render();
        break;
      }
      case "rc-toggle-emoji": {
        var idx2 = Number(el.dataset.idx);
        S.receiptEmojiOpenIdx = (S.receiptEmojiOpenIdx === idx2) ? null : idx2;
        render();
        break;
      }
      case "rc-set-emoji": {
        if (S.receiptEmojiOpenIdx != null && S.receiptCandidates[S.receiptEmojiOpenIdx]) {
          S.receiptCandidates[S.receiptEmojiOpenIdx].emoji = el.dataset.emoji;
        }
        S.receiptEmojiOpenIdx = null;
        render();
        break;
      }
      case "rc-set-type": {
        var idx3 = Number(el.dataset.idx);
        if (S.receiptCandidates[idx3]) S.receiptCandidates[idx3].type = el.dataset.type;
        render();
        break;
      }
      case "rc-qty-delta": {
        var idx4 = Number(el.dataset.idx);
        var c4 = S.receiptCandidates[idx4];
        if (c4) c4.qty = Math.max(1, (c4.qty || 1) + Number(el.dataset.delta));
        render();
        break;
      }
      case "rc-set-gauge": {
        var idx5 = Number(el.dataset.idx);
        if (S.receiptCandidates[idx5]) S.receiptCandidates[idx5].gauge = Number(el.dataset.g);
        render();
        break;
      }
      case "rc-ignore": {
        var idx6 = Number(el.dataset.idx);
        var c6 = S.receiptCandidates[idx6];
        if (c6) {
          S.data.receiptDict[normalizeReceiptKey(c6.raw)] = { ignore: true, updatedAt: Date.now() };
          persist(S.data);
          S.receiptCandidates.splice(idx6, 1);
          if (S.receiptEmojiOpenIdx === idx6) S.receiptEmojiOpenIdx = null;
        }
        render();
        break;
      }
      case "header-emoji": break; // クリック自体は何もしない(長押しはhandlePressStart側で処理)
      case "settings-open": openSettingsSheet(); break;
      case "close-settings": closeSettingsSheet(); break;
      case "settings-set-enabled": {
        if (S.settingsForm) S.settingsForm.enabled = el.dataset.enabled === "1";
        commitSettingsForm();
        render();
        break;
      }
      case "settings-test": testSyncConnection(); break;
      case "settings-sync-now": syncNow(); break;
      // ── マイ料理(Phase 4) ──
      case "recipe-open": openRecipeSheet(); break;
      case "recipe-close": closeRecipeSheet(); break;
      case "recipe-back": backToRecipeList(); break;
      case "recipe-add-new": openRecipeNewForm(); break;
      case "recipe-edit-open": openRecipeEditForm(el.dataset.id); break;
      case "recipe-cook-open": openRecipeCook(el.dataset.id); break;
      case "recipe-delete": if (S.recipeForm) deleteRecipe(S.recipeForm.id); break;
      case "recipe-save": saveRecipeForm(); break;
      case "recipe-set-emoji": if (S.recipeForm) { S.recipeForm.emoji = el.dataset.emoji; render(); } break;
      case "recipe-ing-add-known":
        recipeAddIngredient(el.dataset.name, el.dataset.type);
        render();
        break;
      case "recipe-ing-add-custom": {
        var ingName = (S.recipeIngredientInput || "").trim();
        if (ingName) {
          var ingKnown = S.data.dict[ingName] || FOOD_DICT[ingName];
          recipeAddIngredient(ingName, ingKnown ? ingKnown.type : "count");
          S.recipeIngredientInput = "";
        }
        render();
        break;
      }
      case "recipe-ing-remove": {
        var rmIdx = Number(el.dataset.idx);
        if (S.recipeForm) S.recipeForm.ingredients.splice(rmIdx, 1);
        render();
        break;
      }
      case "recipe-ing-qty-delta": {
        var qIdx = Number(el.dataset.idx);
        var ing = S.recipeForm && S.recipeForm.ingredients[qIdx];
        if (ing) ing.qty = Math.max(1, (ing.qty || 1) + Number(el.dataset.delta));
        render();
        break;
      }
      case "recipe-ing-set-type": {
        var tIdx = Number(el.dataset.idx);
        var ing2 = S.recipeForm && S.recipeForm.ingredients[tIdx];
        if (ing2) {
          ing2.type = el.dataset.type;
          ing2.qty = ing2.type === "count" ? Math.max(1, Number(ing2.qty) || 1) : 0;
        }
        render();
        break;
      }
      case "cook-toggle-on": {
        var onIdx = Number(el.dataset.idx);
        var row1 = S.cookForm && S.cookForm.rows[onIdx];
        if (row1 && row1.status !== "missing") row1.on = !row1.on;
        render();
        break;
      }
      case "cook-consume-delta": {
        var cIdx = Number(el.dataset.idx);
        var row2 = S.cookForm && S.cookForm.rows[cIdx];
        if (row2) row2.consume = Math.max(0, Math.min(row2.have, (row2.consume || 0) + Number(el.dataset.delta)));
        render();
        break;
      }
      case "cook-gauge-choice": {
        var gIdx = Number(el.dataset.idx);
        var row3 = S.cookForm && S.cookForm.rows[gIdx];
        if (row3 && row3.status !== "missing") row3.gaugeChoice = el.dataset.choice;
        render();
        break;
      }
      case "cook-confirm": submitCook(); break;
    }
  }

  // ヘッダーのキャラ画像長押しで設定シートを開く(隠し入口)。data-action="header-emoji"の要素を
  // 押し始めてから650ms後に離さず保持していたら開く。タップ(短押し)では何も起きない。
  var headerLongPressTimer = null;
  function handlePressStart(e){
    var el = e.target.closest('[data-action="header-emoji"]');
    if (!el) return;
    if (headerLongPressTimer) clearTimeout(headerLongPressTimer);
    headerLongPressTimer = setTimeout(function(){
      headerLongPressTimer = null;
      openSettingsSheet();
    }, 650);
  }
  function handlePressEnd(){
    if (headerLongPressTimer) { clearTimeout(headerLongPressTimer); headerLongPressTimer = null; }
  }

  function init(){
    var app = document.getElementById("app");
    app.addEventListener("click", handleClick);
    app.addEventListener("input", handleInput);
    app.addEventListener("change", handleChange);
    app.addEventListener("focusout", handleFocusOut);
    app.addEventListener("keydown", handleKeydown);
    // ヘッダーのキャラ画像の長押し検出(touchとmouse両対応。iOS実機はtouch、プレビュー確認はmouseで使う)
    app.addEventListener("touchstart", handlePressStart, { passive:true });
    app.addEventListener("touchend", handlePressEnd);
    app.addEventListener("touchcancel", handlePressEnd);
    app.addEventListener("mousedown", handlePressStart);
    app.addEventListener("mouseup", handlePressEnd);
    app.addEventListener("mouseleave", handlePressEnd);

    loadSyncConfig();
    S.data = loadData();
    render();
    applyReceiptShortcut(); // データロード後にハッシュを見てレシート取り込みシートを自動オープン
    // Safariが「同じURLのタブを使い回してハッシュだけ変える」場合はページが再読み込みされず
    // 上の起動時チェックが走らない(ショートカット2回目以降で必ず起きる)。hashchangeでも拾う。
    window.addEventListener("hashchange", applyReceiptShortcut);

    // Phase 2同期: 起動時(設定済みなら)に1回実行する。以後はpersist()経由のデバウンス自動同期・
    // visibilitychangeでのフォアグラウンド復帰・設定シートの「今すぐ同期」で実行する。
    // loadData()内のpersist()が既にデバウンス予約している場合があるので、二重発火を避けるため
    // 一旦クリアしてから即時実行する。
    if (SYNC.debounceTimer) { clearTimeout(SYNC.debounceTimer); SYNC.debounceTimer = null; }
    runSync({ manual:false });
    document.addEventListener("visibilitychange", function(){
      if (document.visibilityState === "visible") runSync({ manual:false });
    });
  }

  init();
})();
</script>
<script>
// Service Worker登録(PWA・オフライン対応)。パスは相対必須(GitHub Pagesのサブディレクトリ配下対応)
if ("serviceWorker" in navigator) {
  window.addEventListener("load", function(){
    navigator.serviceWorker.register("./sw.js").catch(function(){ /* 登録失敗でもアプリは動く */ });
  });
}
</script>
