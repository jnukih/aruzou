<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>あるぞう</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="あるぞう">
<meta name="theme-color" content="#FFF8EF">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon-180-v2.png">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<style>
  /* ===================================================================
     あるぞう Phase 1 (v0.3.0)
     冷蔵庫・日用品・リュクサク(ペット)用品の在庫を絵文字で管理するPWA(ローカル版)。
     v0.3.0: よく買うものプリセットをstate化(favorites・追加/削除UI)/ プリセットタップのフィードバック(アニメ+トースト+在庫バッジ)/
     絵文字ピッカーのジャンル分け表示 / 「リュサク」→「リュクサク」表記変更・タブアイコンをemojiHTML経由に。
     該当するUnicode絵文字が無い食材は CUSTOM_EMOJI レジストリ(':name:'キー→data URI画像、現在:mayo:/:natto:/:tofu:/:shiokombu:)で表示する。
     再描画のたびにシート/ページのスクロール位置を保存・復元する(render()参照)。
     追加シートで絵文字ピッカーを選ぶと EMOJI_TO_NAME 逆引きマップから名前を自動入力する(手入力は上書きしない)。

     データモデル (localStorage key: "aruzou-v1")
     {
       items:    [{ id, name, emoji, type:'count'|'gauge', qty, gauge(0-3),
                     cat:'fridge'|'daily'|'pet',
                     dept: 冷蔵庫='冷蔵'|'冷凍'|'野菜室' / 日用品='洗面所'|'風呂'|'掃除'|'洗濯'|'その他' / ペット=null,
                     addedAt }],
       shopping: [{ id, name, emoji, checked, cat, dept, addedAt }],
       dict:     { <名前>: {emoji, type, cat, dept} }  // 学習辞書
     }

     素のJS・単一HTML・ビルド無し・CDN無し・外部通信ゼロ。
     全再描画方式(状態変更 → render())。フレームワーク不使用。
     =================================================================== */
  :root{
    --bg:#FFF8EF;
    --card:#FFFFFF;
    --main:#E08A3E;
    --main-dark:#C06F28;
    --accent:#F6B93B;
    --text:#4A3B2E;
    --sub:#A9998A;
    --sub2:#8C7C6D;
    --border:#F0E1CB;
    --border-strong:#E3CBA3;
    --danger:#D9705F;
    --section-bg:#FFF3E0;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  html{ -webkit-text-size-adjust:100%; }
  body{
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
    overscroll-behavior-y:contain;
    -webkit-tap-highlight-color:transparent;
    min-height:100vh;
  }
  #app{
    min-height:100vh;
    padding-bottom:calc(96px + env(safe-area-inset-bottom));
    padding-left:env(safe-area-inset-left);
    padding-right:env(safe-area-inset-right);
  }
  button{
    font-family:inherit;
    user-select:none;
    -webkit-user-select:none;
  }
  input, select, textarea{
    font-family:inherit;
    font-size:16px; /* iOS自動ズーム防止のため16px未満は使わない */
  }

  /* ── ヘッダー ── */
  .header{
    display:flex; align-items:center; gap:8px;
    padding:calc(16px + env(safe-area-inset-top)) 18px 8px;
  }
  .header-emoji{ font-size:28px; }
  .header-title{ font-size:21px; font-weight:800; color:var(--main-dark); letter-spacing:1px; }

  /* ── 汎用 ── */
  .field{
    width:100%; box-sizing:border-box; padding:11px 12px;
    border-radius:10px; border:1px solid var(--border);
    font-size:16px; font-family:inherit; color:var(--text); background:#FFF;
  }
  .tab-body{ padding:6px 16px 20px; }

  .add-btn{
    width:100%; padding:13px 0; margin-bottom:16px; border-radius:14px;
    border:1px dashed var(--border-strong); background:#FFF; color:var(--main-dark);
    font-weight:700; font-size:14px; cursor:pointer;
  }

  .section{ margin-bottom:20px; }
  .section-title{
    font-size:12.5px; font-weight:800; color:var(--main-dark);
    margin-bottom:8px; padding-left:2px; letter-spacing:1px;
  }
  .item-list{ display:flex; flex-direction:column; gap:10px; }

  .item-card{
    background:var(--card); border-radius:16px; padding:12px 14px;
    box-shadow:0 1px 3px rgba(90,60,30,.08);
  }
  .item-card.flash{ animation:popScale .26s ease; }
  @keyframes popScale{ 0%{transform:scale(1);} 45%{transform:scale(1.035);} 100%{transform:scale(1);} }

  .item-head{
    display:flex; align-items:center; gap:8px; cursor:pointer;
    padding:2px 2px 8px; user-select:none; -webkit-user-select:none;
  }
  .item-emoji-lead{ font-size:20px; }
  .item-name{ font-size:15px; font-weight:700; color:var(--text); }

  .emoji-row{ display:flex; flex-wrap:wrap; gap:8px; }
  .emoji-tap{
    width:40px; height:40px; min-height:40px; font-size:22px; border:none;
    background:var(--section-bg); border-radius:10px; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    transition:transform .12s ease; padding:0;
  }
  .emoji-tap:active{ transform:scale(1.2); }
  .emoji-badge{
    min-width:40px; height:40px; padding:0 10px; font-size:14px; font-weight:800;
    color:#FFF; background:var(--main); border:none; border-radius:10px; cursor:pointer;
  }
  .emoji-badge:active{ transform:scale(1.1); }

  .gauge-row{
    width:100%; display:flex; align-items:center; justify-content:space-between;
    background:var(--section-bg); border:none; border-radius:12px; padding:13px 14px;
    cursor:pointer; font-family:inherit; min-height:44px;
  }
  .gauge-row:active{ transform:scale(1.015); }
  .gauge-dots{ font-size:18px; letter-spacing:5px; color:var(--main); }
  .gauge-label{ font-size:13px; font-weight:700; color:var(--sub2); }

  .empty-state{ text-align:center; padding:60px 16px 20px; }
  .empty-emoji{ font-size:58px; margin-bottom:10px; }
  .empty-msg{ font-size:14.5px; color:var(--sub2); font-weight:700; }

  /* ── タブバー(下部固定) ── */
  .tab-bar{
    position:fixed; left:0; right:0; bottom:0; display:flex;
    background:#FFF; border-top:1px solid var(--border);
    padding:6px env(safe-area-inset-right) calc(6px + env(safe-area-inset-bottom)) env(safe-area-inset-left);
    z-index:20;
  }
  .tab-btn{
    flex:1; display:flex; flex-direction:column; align-items:center; gap:2px;
    padding:6px 0; background:none; border:none; cursor:pointer; color:var(--sub);
    min-height:48px;
  }
  .tab-btn.active{ color:var(--main-dark); }
  .tab-icon{ font-size:22px; }
  .tab-label{ font-size:10.5px; font-weight:700; }

  /* ── トースト ── */
  .toast{
    position:fixed; left:16px; right:16px; bottom:calc(78px + env(safe-area-inset-bottom));
    background:var(--text); color:#FFF; border-radius:14px; padding:12px 14px;
    box-shadow:0 6px 20px rgba(0,0,0,.25); z-index:40;
  }
  .toast-msg{ font-size:14px; font-weight:700; margin-bottom:6px; }
  .toast-actions{ display:flex; gap:8px; }
  .toast-btn{
    flex:1; padding:9px 0; border-radius:10px; border:none;
    background:rgba(255,255,255,.2); color:#FFF; font-weight:700; font-size:12.5px; cursor:pointer;
  }

  /* ── ボトムシート(追加・編集) ── */
  .sheet-backdrop{ position:fixed; inset:0; background:rgba(40,25,10,.35); z-index:50; }
  .sheet{
    position:fixed; left:0; right:0; bottom:0; max-height:88vh; overflow-y:auto;
    background:var(--bg); border-radius:20px 20px 0 0; z-index:51;
    padding-bottom:calc(16px + env(safe-area-inset-bottom));
    box-shadow:0 -8px 30px rgba(0,0,0,.2);
  }
  .sheet-head{
    display:flex; justify-content:space-between; align-items:center;
    padding:16px 18px 8px; font-size:16px; font-weight:800; color:var(--main-dark);
    position:sticky; top:0; background:var(--bg);
  }
  .sheet-close{ border:none; background:none; font-size:24px; color:var(--sub2); cursor:pointer; padding:2px 8px; }
  .sheet-body{ padding:4px 18px 6px; display:flex; flex-direction:column; gap:10px; }
  .sheet-label{ font-size:12px; font-weight:700; color:var(--sub2); margin-top:6px; }
  .sheet-divider{ font-size:11.5px; color:var(--sub); text-align:center; margin:8px 0 2px; }
  .sheet-actions{ display:flex; gap:10px; padding:14px 18px 4px; align-items:center; }

  .favorites-header{ display:flex; align-items:center; justify-content:space-between; }
  .favorites-header .sheet-label{ margin-top:0; }
  .favorites-edit-toggle{
    font-size:11.5px; font-weight:700; color:var(--main-dark); background:none;
    border:none; cursor:pointer; padding:4px 6px;
  }

  .preset-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
  .preset-btn{
    position:relative; display:flex; flex-direction:column; align-items:center; gap:2px; padding:10px 4px;
    border-radius:12px; border:1px solid var(--border); background:#FFF; cursor:pointer;
    font-family:inherit; min-height:44px;
  }
  .preset-btn.flash{ animation:presetPop .26s ease; }
  @keyframes presetPop{ 0%{transform:scale(1);} 45%{transform:scale(1.15);} 100%{transform:scale(1);} }
  .preset-emoji{ font-size:22px; }
  .preset-name{ font-size:11px; color:var(--text); font-weight:600; }
  .preset-badge{
    position:absolute; top:-6px; right:-6px; min-width:17px; height:17px; padding:0 4px;
    border-radius:9px; background:var(--main); color:#FFF; font-size:10px; font-weight:800;
    display:flex; align-items:center; justify-content:center; box-shadow:0 1px 3px rgba(0,0,0,.2);
  }
  .preset-delete-badge{
    position:absolute; top:-6px; right:-6px; width:18px; height:18px;
    border-radius:50%; background:var(--danger); color:#FFF; font-size:12px; font-weight:800;
    display:flex; align-items:center; justify-content:center; box-shadow:0 1px 3px rgba(0,0,0,.2);
    cursor:pointer;
  }

  .fav-checkbox-row{
    display:flex; align-items:center; gap:8px; font-size:13px; color:var(--sub2);
    font-weight:600; margin-top:6px; cursor:pointer;
  }
  .fav-checkbox-row input[type="checkbox"]{ width:18px; height:18px; accent-color:var(--main); }

  .emoji-input{ font-size:20px; text-align:center; }
  .emoji-group-label{
    font-size:10.5px; font-weight:700; color:var(--sub); letter-spacing:.5px;
    margin:8px 2px 2px;
  }
  .emoji-group-label:first-of-type{ margin-top:2px; }
  .emoji-grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:6px; }
  .emoji-choice{
    font-size:20px; padding:7px 0; border-radius:8px; border:1px solid transparent;
    background:var(--section-bg); cursor:pointer; min-height:40px;
  }
  .emoji-choice.selected{ border-color:var(--main); background:#FFF; }

  /* ── カスタム絵文字画像(CUSTOM_EMOJI) ── */
  .custom-emoji-img{ object-fit:contain; vertical-align:middle; display:inline-block; }
  .ce-18{ width:18px; height:18px; }
  .ce-20{ width:20px; height:20px; }
  .ce-22{ width:22px; height:22px; }

  .segmented{ display:flex; border:1px solid var(--border); border-radius:12px; overflow:hidden; }
  .seg-btn{
    flex:1; padding:11px 0; background:#FFF; border:none; font-size:13.5px; font-weight:700;
    color:var(--sub2); cursor:pointer; font-family:inherit; min-height:44px;
  }
  .seg-btn.active{ background:var(--main); color:#FFF; }

  .stepper{ display:flex; align-items:center; justify-content:center; gap:18px; }
  .stepper-btn{
    width:42px; height:42px; border-radius:10px; border:1px solid var(--border);
    background:#FFF; font-size:18px; font-weight:800; color:var(--main-dark); cursor:pointer;
  }
  .stepper-val{ font-size:19px; font-weight:800; min-width:36px; text-align:center; }

  .gauge-select{ display:flex; gap:6px; }
  .gauge-opt{
    flex:1; padding:11px 2px; border-radius:10px; border:1px solid var(--border);
    background:#FFF; font-size:12px; font-weight:700; color:var(--sub2); cursor:pointer; min-height:44px;
  }
  .gauge-opt.active{ background:var(--main); color:#FFF; border-color:var(--main); }

  .btn-outline{
    flex:1; padding:13px 0; border-radius:14px; border:1px solid var(--border-strong);
    background:#FFF; color:var(--main-dark); font-weight:700; font-size:14px; cursor:pointer;
  }
  .btn-outline[disabled]{ opacity:.4; }
  .btn-primary{
    flex:1; padding:13px 0; border-radius:14px; border:none;
    background:var(--main); color:#FFF; font-weight:700; font-size:14px; cursor:pointer;
    box-shadow:0 4px 14px rgba(224,138,62,.35);
  }
  .btn-primary[disabled]{ opacity:.4; box-shadow:none; }
  .delete-link{
    border:none; background:none; color:var(--danger); font-weight:700; font-size:14px;
    cursor:pointer; padding:13px 12px;
  }

  /* ── 買い物リストタブ ── */
  .shopping-add-row{ display:flex; gap:8px; margin-bottom:16px; }
  .shopping-add-row .field{ flex:1; }
  .add-btn.small{
    width:44px; height:44px; border-radius:12px; border:none;
    background:var(--main); color:#FFF; font-size:20px; margin:0; padding:0; flex:none;
  }
  .shopping-row{
    display:flex; align-items:center; gap:10px; background:var(--card);
    border-radius:14px; padding:10px 12px;
  }
  .shopping-row.checked .shopping-name{ text-decoration:line-through; color:var(--sub); }
  .check-box{
    width:27px; height:27px; border-radius:8px; border:2px solid var(--border-strong);
    background:#FFF; color:#FFF; font-size:14px; font-weight:800;
    display:flex; align-items:center; justify-content:center; cursor:pointer; flex:none;
  }
  .shopping-row.checked .check-box{ background:var(--main); border-color:var(--main); }
  .shopping-emoji{ font-size:18px; }
  .shopping-name{ flex:1; font-size:14.5px; font-weight:600; color:var(--text); }
  .x-btn{
    width:30px; height:30px; border-radius:50%; border:none; background:var(--section-bg);
    color:var(--sub2); font-size:14px; cursor:pointer; flex:none;
  }
  .shopping-actions{ display:flex; gap:10px; margin-top:18px; }
</style>
</head>
<body>
<div id="app"></div>

  "use strict";

    ]
  };

  // 食材絵文字辞書(内蔵・自由入力時の自動サジェスト用)。調味料類はgaugeがデフォルト
  var FOOD_DICT = {
    "たまご":{emoji:"🥚",type:"count",dept:"冷蔵"}, "卵":{emoji:"🥚",type:"count",dept:"冷蔵"},

  function esc(s){
    return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }
  function defaultEmojiForCat(cat){
    return cat === "daily" ? "🧴" : cat === "pet" ? "🐾" : "🍽";
  }
  // 絵文字表示の共通ヘルパー。値が ':xxx:' 形式でCUSTOM_EMOJIに登録があれば画像を、
  // 無ければ従来どおりのテキスト絵文字を返す。sizeClassは .ce-18/.ce-20/.ce-22 等。
  function emojiHTML(emoji, sizeClass){
    var key = emoji == null ? "" : String(emoji);
    var src = CUSTOM_EMOJI[key];
    if (src) {
      return '<img src="' + src + '" class="custom-emoji-img' + (sizeClass ? ' ' + sizeClass : '') + '" alt="">';
    }
    return esc(key);
  }
  // 絵文字ピッカーをジャンル見出し付きグリッドで描画する共通ヘルパー(追加・編集シート共通)。
  function renderEmojiGroupsHtml(selectedEmoji, action){
    return EMOJI_GROUPS.map(function(g){
      var grid = g.items.map(function(em){
        var sel = selectedEmoji === em ? ' selected' : '';
        return '<button class="emoji-choice' + sel + '" data-action="' + action + '" data-emoji="' + esc(em) + '">' + emojiHTML(em, 'ce-20') + '</button>';
      }).join('');
      return '<div class="emoji-group-label">' + esc(g.label) + '</div><div class="emoji-grid">' + grid + '</div>';
    }).join('');
  }

  // ─────────────────────────────────────────
  // ストレージ
  // ─────────────────────────────────────────
  function persist(d){
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(d)); }
    catch (e) { console.error("保存に失敗", e); }
  }
  function normalizeData(d){
    if (!d || typeof d !== "object") d = {};
    if (!Array.isArray(d.items)) d.items = [];
    if (!Array.isArray(d.shopping)) d.shopping = [];
    if (!d.dict || typeof d.dict !== "object") d.dict = {};
    if (!d.favorites || typeof d.favorites !== "object") d.favorites = {};
    // 「よく買うもの」はPRESETSを初期値としてstate化している。無ければ既定値をコピーして初期化する(1回きり)。
    ["fridge", "daily", "pet"].forEach(function(cat){
      if (!Array.isArray(d.favorites[cat])) {
        d.favorites[cat] = JSON.parse(JSON.stringify(PRESETS[cat] || []));
      }
    });
    return d;
  }
  // 旧データ移行: 名前と旧絵文字が一致するエントリをCUSTOM_EMOJIキーに書き換える(1回きりの軽い処理)。
  // 今後カスタム絵文字を追加する際はこのリストにも1行足す。
  var LEGACY_EMOJI_MIGRATIONS = [
    { name:"マヨネーズ", oldEmoji:"🥚", newKey:":mayo:" },
    { name:"納豆", oldEmoji:"🫘", newKey:":natto:" },
    { name:"豆腐", oldEmoji:"🍥", newKey:":tofu:" },
    { name:"塩昆布", oldEmoji:"🌊", newKey:":shiokombu:" }
  ];
  function migrateLegacyEmoji(d){
    function fix(obj){
      if (!obj) return;
      for (var i = 0; i < LEGACY_EMOJI_MIGRATIONS.length; i++){
        var m = LEGACY_EMOJI_MIGRATIONS[i];
        if (obj.name === m.name && obj.emoji === m.oldEmoji) { obj.emoji = m.newKey; return; }
      }
    }
    (d.items || []).forEach(fix);
    (d.shopping || []).forEach(fix);
    LEGACY_EMOJI_MIGRATIONS.forEach(function(m){
      if (d.dict && d.dict[m.name] && d.dict[m.name].emoji === m.oldEmoji) {
        d.dict[m.name].emoji = m.newKey;
      }
    });
  }
  function loadData(){
    var d = null;
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (raw) d = JSON.parse(raw);
    } catch (e) {}
    d = normalizeData(d);
    migrateLegacyEmoji(d);
    persist(d);
    return d;
  }

  // ─────────────────────────────────────────
  // アプリ状態
  // ─────────────────────────────────────────
  var S = {
    data: null,
    tab: "fridge", // fridge | daily | pet | shopping
    addOpen: false,
    addForm: null,
    editingId: null,
    editForm: null,
    shoppingInput: "",
    toast: null,     // { msg, buttons:[{label,action}], data }
    flashId: null,   // 直近タップしたアイテムidにポップアニメーションを付ける
    presetFlashKey: null,     // 直近タップしたプリセット(cat+"|"+name)にポップアニメーションを付ける
    favoritesEditMode: false, // よく買うものグリッドの編集(削除)モード
  };
  var undoSnapshot = null; // 直前の1操作分のデータスナップショット(JSON文字列)
  var toastTimer = null;

  function currentData(){ return S.data; }

  // ─────────────────────────────────────────
  // Undo / トースト
  // ─────────────────────────────────────────
  function pushUndo(){
    undoSnapshot = JSON.stringify(S.data);
  }
  function doUndo(){
    if (!undoSnapshot) { hideToast(); render(); return; }
    S.data = JSON.parse(undoSnapshot);
    undoSnapshot = null;
    persist(S.data);
    hideToast();
    showToast("もどしたぞう", [], 2200);
  }
  function showToast(msg, buttons, duration, data){
    if (toastTimer) clearTimeout(toastTimer);
    S.toast = { msg: msg, buttons: buttons || [], data: data || null };
    render();
    toastTimer = setTimeout(function(){
      S.toast = null;
      toastTimer = null;
      render();
    }, duration || 3000);
  }
  function hideToast(){
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = null;
    S.toast = null;
    render();
  }
  function flashThenRender(id){
    S.flashId = id;
    render();
    setTimeout(function(){
      if (S.flashId === id) { S.flashId = null; render(); }
    }, 260);
  }

  // ─────────────────────────────────────────
  // 在庫アイテム操作
  // ─────────────────────────────────────────
  function upsertItem(cat, name, emoji, type, dept){
    var items = S.data.items;
    var existing = null;
    for (var i = 0; i < items.length; i++){
      if (items[i].cat === cat && items[i].name === name) { existing = items[i]; break; }
    }
    if (existing) {
      if (existing.type === "count") existing.qty = (existing.qty || 0) + 1;
      else existing.gauge = 3;
    } else {
      items.push({
        id: newId(), name: name, emoji: emoji, type: type,
        qty: type === "count" ? 1 : 0,
        gauge: type === "gauge" ? 3 : 0,
        cat: cat, dept: dept, addedAt: Date.now()
      });
    }
    S.data.dict[name] = { emoji: emoji, type: type, cat: cat, dept: dept };
    persist(S.data);
  }

  function addToShoppingIfNotExists(name, emoji, cat, dept){
    var exists = S.data.shopping.some(function(s){ return s.name === name && s.cat === cat; });
    if (exists) return false;
    S.data.shopping.push({ id:newId(), name:name, emoji:emoji, checked:false, cat:cat, dept:dept, addedAt:Date.now() });
    persist(S.data);
    return true;
  }

  function findItem(id){
    for (var i = 0; i < S.data.items.length; i++){
      if (S.data.items[i].id === id) return S.data.items[i];
    }
    return null;
  }

  // 個数ものを1個消費する。0になったら在庫から消え、買い物リストへの追加を促すトーストを出す
  function consumeItem(id){
    var it = findItem(id);
    if (!it || it.type !== "count") return;
    pushUndo();
    it.qty -= 1;
    if (it.qty <= 0) {
      var idx = S.data.items.indexOf(it);
      S.data.items.splice(idx, 1);
      persist(S.data);
      showToast("つかいきったぞう！", [
        { label:"もどす", action:"toast-undo" },
        { label:"🛒買い物リストに入れる", action:"toast-add-shopping" }
      ], 6000, { name: it.name, emoji: it.emoji, cat: it.cat, dept: it.dept });
    } else {
      persist(S.data);
      flashThenRender(it.id);
      showToast("つかったぞう", [{ label:"もどす", action:"toast-undo" }], 3000);
    }
  }

  // 残量ものを1段階減らす。0のときはタップしても何もしない
  function tapGauge(id){
    var it = findItem(id);
    if (!it || it.type !== "gauge") return;
    if (it.gauge <= 0) return;
    pushUndo();
    it.gauge -= 1;
    persist(S.data);
    if (it.gauge <= 1) {
      addToShoppingIfNotExists(it.name, it.emoji, it.cat, it.dept);
      flashThenRender(it.id);
      showToast("そろそろないぞう", [{ label:"もどす", action:"toast-undo" }], 4000);
    } else {
      flashThenRender(it.id);
      showToast("つかったぞう", [{ label:"もどす", action:"toast-undo" }], 3000);
    }
  }

  function deleteItem(id){
    var it = findItem(id);
    if (!it) return;
    pushUndo();
    var idx = S.data.items.indexOf(it);
    S.data.items.splice(idx, 1);
    persist(S.data);
    closeEditSheet();
    showToast("けしたぞう", [{ label:"もどす", action:"toast-undo" }], 3500);
  }

  // ─────────────────────────────────────────
  // 追加シート
  // ─────────────────────────────────────────
  function openAddSheet(){
    var cat = S.tab;
    S.addForm = {
      name:"", emoji:"", type:"count", qty:1, gauge:3, cat:cat,
      dept: cat === "pet" ? null : DEPTS[cat][0],
      nameAuto:false, autoNameValue:"",  // ピッカー選択による名前自動入力の追跡用
      registerFavorite:false             // 「⭐よく買うものに登録」チェック
    };
    S.addOpen = true;
    S.favoritesEditMode = false;
    render();
  }
  function closeAddSheet(){ S.addOpen = false; S.addForm = null; S.favoritesEditMode = false; render(); }

  var FAVORITES_LIMIT = 20;

  // よく買うものへ追加(重複無視・上限あり)。 { ok, reason:"full"|"duplicate" } を返す
  function addFavoriteIfPossible(cat, name, emoji, type, dept){
    var list = S.data.favorites[cat];
    if (!list) return { ok:false };
    if (list.some(function(p){ return p.name === name; })) return { ok:true, duplicate:true };
    if (list.length >= FAVORITES_LIMIT) return { ok:false, reason:"full" };
    list.push({ name:name, emoji:emoji, type:type, dept:dept });
    persist(S.data);
    return { ok:true };
  }

  function deleteFavorite(cat, name){
    var list = S.data.favorites[cat];
    if (!list) return;
    var idx = -1;
    for (var i = 0; i < list.length; i++){ if (list[i].name === name) { idx = i; break; } }
    if (idx < 0) return;
    pushUndo();
    list.splice(idx, 1);
    persist(S.data);
    showToast("けしたぞう", [{ label:"もどす", action:"toast-undo" }], 3000);
  }

  function addPreset(cat, preset){
    upsertItem(cat, preset.name, preset.emoji, preset.type, preset.dept);
    var flashKey = cat + "|" + preset.name;
    S.presetFlashKey = flashKey;
    showToast("いれたぞう！", [], 1800);
    setTimeout(function(){
      if (S.presetFlashKey === flashKey) { S.presetFlashKey = null; render(); }
    }, 260);
  }

  function submitAddForm(){
    var f = S.addForm;
    var name = (f.name || "").trim();
    if (!name) return;
    var emoji = (f.emoji || "").trim() || defaultEmojiForCat(f.cat);
    var dept = f.cat === "pet" ? null : f.dept;
    var existedBefore = S.data.items.some(function(it){ return it.cat === f.cat && it.name === name; });
    upsertItem(f.cat, name, emoji, f.type, dept);
    if (!existedBefore) {
      var it = null;
      for (var i = 0; i < S.data.items.length; i++){
        if (S.data.items[i].cat === f.cat && S.data.items[i].name === name) { it = S.data.items[i]; break; }
      }
      if (it) {
        if (f.type === "count") it.qty = Math.max(1, Number(f.qty) || 1);
        else it.gauge = Number(f.gauge);
        persist(S.data);
      }
    }
    var favFullMsg = null;
    if (f.registerFavorite) {
      var favRes = addFavoriteIfPossible(f.cat, name, emoji, f.type, dept);
      if (!favRes.ok && favRes.reason === "full") favFullMsg = "いっぱいだぞう";
    }
    closeAddSheet();
    showToast(favFullMsg || "いれたぞう！", [], favFullMsg ? 2600 : 2000);
  }

  // 名前入力から学習辞書・食材絵文字辞書を引いて絵文字/タイプ/部門をサジェストする
  function trySuggest(formObj, name){
    var key = String(name || "").trim();
    if (!key) return;
    var known = S.data.dict[key] || FOOD_DICT[key];
    if (!known) return;
    if (known.emoji) formObj.emoji = known.emoji;
    if (known.type) formObj.type = known.type;
    if (formObj.cat !== "pet") {
      var validDepts = DEPTS[formObj.cat] || [];
      if (known.dept && validDepts.indexOf(known.dept) !== -1) formObj.dept = known.dept;
    }
  }

  // ─────────────────────────────────────────
  // 編集シート
  // ─────────────────────────────────────────
  function openEditSheet(id){
    var it = findItem(id);
    if (!it) return;
    S.editingId = id;
    S.editForm = {
      name: it.name, emoji: it.emoji, type: it.type,
      qty: it.qty || 1, gauge: it.gauge || 0, cat: it.cat, dept: it.dept
    };
    render();
  }
  function closeEditSheet(){ S.editingId = null; S.editForm = null; render(); }

  function saveEditItem(){
    var it = findItem(S.editingId);
    if (!it) return;
    var f = S.editForm;
    var name = (f.name || "").trim();
    if (!name) return;
    it.name = name;
    it.emoji = (f.emoji || "").trim() || defaultEmojiForCat(f.cat);
    it.type = f.type;
    it.cat = f.cat;
    it.dept = f.cat === "pet" ? null : f.dept;
    if (f.type === "count") {
      it.qty = Math.max(1, Number(f.qty) || 1);
      it.gauge = 0;
    } else {
      it.gauge = Number(f.gauge);
      it.qty = 0;
      if (it.gauge <= 1) addToShoppingIfNotExists(it.name, it.emoji, it.cat, it.dept);
    }
    S.data.dict[it.name] = { emoji: it.emoji, type: it.type, cat: it.cat, dept: it.dept };
    persist(S.data);
    closeEditSheet();
  }

  // ─────────────────────────────────────────
  // 買い物リスト
  // ─────────────────────────────────────────
  function addShoppingManual(){
    var name = (S.shoppingInput || "").trim();
    if (!name) return;
    var known = S.data.dict[name];
    var cat = null, dept = null, emoji = "🛒";
    if (known) { emoji = known.emoji || emoji; cat = known.cat || null; dept = known.dept || null; }
    else if (FOOD_DICT[name]) { emoji = FOOD_DICT[name].emoji; cat = "fridge"; dept = FOOD_DICT[name].dept || null; }
    var added = addToShoppingIfNotExists(name, emoji, cat, dept);
    S.shoppingInput = "";
    render();
    if (added) showToast("メモしたぞう", [], 2000);
  }
  function toggleShoppingChecked(id){
    var s = null;
    for (var i = 0; i < S.data.shopping.length; i++){
      if (S.data.shopping[i].id === id) { s = S.data.shopping[i]; break; }
    }
    if (!s) return;
    s.checked = !s.checked;
    persist(S.data);
    render();
  }
  function deleteShoppingItem(id){
    var idx = -1;
    for (var i = 0; i < S.data.shopping.length; i++){
      if (S.data.shopping[i].id === id) { idx = i; break; }
    }
    if (idx < 0) return;
    pushUndo();
    S.data.shopping.splice(idx, 1);
    persist(S.data);
    showToast("けしたぞう", [{ label:"もどす", action:"toast-undo" }], 3000);
  }
  function clearCheckedShopping(){
    var hasChecked = S.data.shopping.some(function(s){ return s.checked; });
    if (!hasChecked) return;
    pushUndo();
    S.data.shopping = S.data.shopping.filter(function(s){ return !s.checked; });
    persist(S.data);
    showToast("けしたぞう", [{ label:"もどす", action:"toast-undo" }], 3000);
  }
  function moveCheckedToStock(){
    var checked = S.data.shopping.filter(function(s){ return s.checked; });
    if (!checked.length) return;
    pushUndo();
    checked.forEach(function(s){
      var known = S.data.dict[s.name];
      var cat = s.cat || (known && known.cat) || "fridge";
      var dept = s.dept || (known && known.dept) || (DEPTS[cat] ? DEPTS[cat][0] : null);
      if (cat === "pet") dept = null;
      var type = (known && known.type) || "count";
      upsertItem(cat, s.name, s.emoji || "🛒", type, dept);
    });
    S.data.shopping = S.data.shopping.filter(function(s){ return !s.checked; });
    persist(S.data);
    showToast("いれたぞう！", [{ label:"もどす", action:"toast-undo" }], 4000);
  }

  // ─────────────────────────────────────────
  // 描画: 小物
  // ─────────────────────────────────────────
  function emptyStateHtml(msg){
    return '<div class="empty-state"><div class="empty-emoji">🐘</div><div class="empty-msg">' + esc(msg) + '</div></div>';
  }

  function gaugeSelectorHtml(action, current){
    var levels = [{v:3,l:"たっぷり"},{v:2,l:"半分"},{v:1,l:"少ない"},{v:0,l:"なし"}];
    return '<div class="gauge-select">' + levels.map(function(lv){
      return '<button class="gauge-opt' + (current === lv.v ? ' active' : '') + '" data-action="' + action + '" data-g="' + lv.v + '">' + lv.l + '</button>';
    }).join('') + '</div>';
  }

  function renderItemRow(it){
    var flashClass = (S.flashId === it.id) ? ' flash' : '';
    var head = '<div class="item-head" data-action="edit-item" data-id="' + it.id + '">' +
      '<span class="item-emoji-lead">' + emojiHTML(it.emoji, 'ce-20') + '</span>' +
      '<span class="item-name">' + esc(it.name) + '</span>' +
    '</div>';
    var body;
    if (it.type === "count") {
      var qty = it.qty || 0;
      var shown = Math.min(qty, 10);
      var btns = "";
      for (var i = 0; i < shown; i++){
        btns += '<button class="emoji-tap" data-action="consume-item" data-id="' + it.id + '">' + emojiHTML(it.emoji, 'ce-22') + '</button>';
      }
      var overflow = qty > 10 ? '<button class="emoji-badge" data-action="consume-item" data-id="' + it.id + '">×' + qty + '</button>' : "";
      body = '<div class="emoji-row">' + btns + overflow + '</div>';
    } else {
      var g = it.gauge || 0;
      var label = g === 3 ? "たっぷり" : g === 2 ? "半分" : g === 1 ? "少ない" : "なし";
      var dots = "";
      for (var j = 0; j < 3; j++) dots += (j < g ? "●" : "○");
      body = '<button class="gauge-row" data-action="gauge-tap" data-id="' + it.id + '">' +
        '<span class="gauge-dots">' + dots + '</span><span class="gauge-label">' + label + '</span>' +
      '</button>';
    }
    return '<div class="item-card' + flashClass + '">' + head + body + '</div>';
  }

  // ─────────────────────────────────────────
  // 描画: タブ本体
  // ─────────────────────────────────────────
  function renderHeader(){
    return '<div class="header"><span class="header-emoji">🐘</span><span class="header-title">あるぞう</span></div>';
  }

  function renderTabBar(){
    // icon はemojiHTML()経由で描画する。今は🐱のままだが、CUSTOM_EMOJIに
    // ':ryukusaku:' 等を登録してこの値を差し替えるだけで画像化できる。
    var tabs = [
      { key:"fridge", icon:"🧊", label:"冷蔵庫" },
      { key:"daily", icon:"🧴", label:"日用品" },
      { key:"pet", icon:":ryukusaku:", label:"リュクサク" },
      { key:"shopping", icon:"🛒", label:"買い物リスト" }
    ];
    var html = tabs.map(function(t){
      var active = S.tab === t.key;
      return '<button class="tab-btn' + (active ? ' active' : '') + '" data-action="set-tab" data-tab="' + t.key + '">' +
        '<div class="tab-icon">' + emojiHTML(t.icon, 'ce-22') + '</div><div class="tab-label">' + t.label + '</div>' +
      '</button>';
    }).join('');
    return '<div class="tab-bar">' + html + '</div>';
  }

  function renderToast(){
    if (!S.toast) return '';
    var btns = (S.toast.buttons || []).map(function(b){
      return '<button class="toast-btn" data-action="' + b.action + '">' + esc(b.label) + '</button>';
    }).join('');
    return '<div class="toast"><div class="toast-msg">' + esc(S.toast.msg) + '</div>' +
      (btns ? '<div class="toast-actions">' + btns + '</div>' : '') +
    '</div>';
  }

  function renderStockTab(cat){
    var items = S.data.items.filter(function(it){ return it.cat === cat; });
    var addBtn = '<button class="add-btn" data-action="open-add">＋ 追加</button>';
    if (!items.length) {
      return '<div class="tab-body">' + addBtn + emptyStateHtml("なんにもないぞう…") + '</div>';
    }
    var sections = "";
    if (cat === "pet") {
      sections = '<div class="section"><div class="item-list">' + items.map(renderItemRow).join('') + '</div></div>';
    } else {
      DEPTS[cat].forEach(function(dept){
        var list = items.filter(function(it){ return it.dept === dept; });
        if (!list.length) return;
        sections += '<div class="section">' +
          '<div class="section-title">' + esc(dept) + '</div>' +
          '<div class="item-list">' + list.map(renderItemRow).join('') + '</div>' +
        '</div>';
      });
    }
    return '<div class="tab-body">' + addBtn + sections + '</div>';
  }

  function renderShoppingRow(s){
    return '<div class="shopping-row' + (s.checked ? ' checked' : '') + '">' +
      '<button class="check-box" data-action="shopping-toggle" data-id="' + s.id + '">' + (s.checked ? '✓' : '') + '</button>' +
      '<span class="shopping-emoji">' + emojiHTML(s.emoji || '🛒', 'ce-18') + '</span>' +
      '<span class="shopping-name">' + esc(s.name) + '</span>' +
      '<button class="x-btn" data-action="shopping-delete" data-id="' + s.id + '">×</button>' +
    '</div>';
  }

  function renderShoppingTab(){
    var list = S.data.shopping;
    var inputRow = '<div class="shopping-add-row">' +
      '<input class="field" type="text" placeholder="かうものの名前" data-field="shopping-input" value="' + esc(S.shoppingInput || '') + '">' +
      '<button class="add-btn small" data-action="shopping-add">＋</button>' +
    '</div>';

    if (!list.length) {
      return '<div class="tab-body">' + inputRow + emptyStateHtml("かうものはないぞう！") + '</div>';
    }

    function groupKey(cat, dept){ return (cat || "none") + "|" + (dept || "none"); }
    var groups = {};
    list.forEach(function(s){
      var k = groupKey(s.cat, s.dept);
      if (!groups[k]) groups[k] = [];
      groups[k].push(s);
    });
    var orderedKeys = [];
    ["fridge", "daily"].forEach(function(cat){
      DEPTS[cat].forEach(function(dept){
        var k = groupKey(cat, dept);
        if (groups[k]) orderedKeys.push(k);
      });
    });
    var petKey = groupKey("pet", null);
    if (groups[petKey]) orderedKeys.push(petKey);
    var noneKey = groupKey(null, null);
    if (groups[noneKey]) orderedKeys.push(noneKey);
    Object.keys(groups).forEach(function(k){
      if (orderedKeys.indexOf(k) === -1) orderedKeys.push(k);
    });

    var sections = orderedKeys.map(function(k){
      var arr = groups[k];
      var parts = k.split("|");
      var cat = parts[0] === "none" ? null : parts[0];
      var dept = parts[1] === "none" ? null : parts[1];
      var title = dept ? dept : (cat ? CAT_LABELS[cat] : "そのほか");
      return '<div class="section"><div class="section-title">' + esc(title) + '</div>' +
        '<div class="item-list">' + arr.map(renderShoppingRow).join('') + '</div></div>';
    }).join('');

    var hasChecked = list.some(function(s){ return s.checked; });
    var actions = '<div class="shopping-actions">' +
      '<button class="btn-outline" data-action="shopping-clear-checked"' + (hasChecked ? '' : ' disabled') + '>チェック済みをまとめて消す</button>' +
      '<button class="btn-primary" data-action="shopping-move-to-stock"' + (hasChecked ? '' : ' disabled') + '>チェック済みを在庫に入れる</button>' +
    '</div>';

    return '<div class="tab-body">' + inputRow + sections + actions + '</div>';
  }

  // ─────────────────────────────────────────
  // 描画: 追加・編集シート
  // ─────────────────────────────────────────
  function renderAddSheet(){
    var f = S.addForm;
    var cat = f.cat;
    var favorites = S.data.favorites[cat] || [];
    var stockList = S.data.items.filter(function(it){ return it.cat === cat; });
    var editMode = S.favoritesEditMode;
    var presetGrid = favorites.map(function(p){
      var flashCls = (S.presetFlashKey === (cat + "|" + p.name)) ? ' flash' : '';
      var badgeHtml = '';
      if (editMode) {
        badgeHtml = '<span class="preset-delete-badge" data-action="favorite-delete" data-cat="' + esc(cat) + '" data-name="' + esc(p.name) + '">×</span>';
      } else {
        var stockIt = null;
        for (var i = 0; i < stockList.length; i++){ if (stockList[i].name === p.name) { stockIt = stockList[i]; break; } }
        if (stockIt) {
          var badgeText = stockIt.type === "count" ? ("×" + (stockIt.qty || 0)) : "✓";
          badgeHtml = '<span class="preset-badge">' + esc(badgeText) + '</span>';
        }
      }
      var actionAttr = editMode ? '' : ' data-action="add-preset" data-name="' + esc(p.name) + '"';
      return '<button class="preset-btn' + flashCls + '"' + actionAttr + '>' +
        badgeHtml +
        '<span class="preset-emoji">' + emojiHTML(p.emoji, 'ce-22') + '</span><span class="preset-name">' + esc(p.name) + '</span>' +
      '</button>';
    }).join('');
    var deptField = "";
    if (cat !== "pet") {
      var deptOptions = DEPTS[cat].map(function(d){
        return '<option value="' + esc(d) + '"' + (f.dept === d ? ' selected' : '') + '>' + esc(d) + '</option>';
      }).join('');
      deptField = '<div class="sheet-label">部門</div><select class="field" data-field="add-dept">' + deptOptions + '</select>';
    }
    var qtyOrGauge = f.type === "count"
      ? '<div class="stepper"><button class="stepper-btn" data-action="add-qty-delta" data-delta="-1">−</button>' +
        '<span class="stepper-val">' + f.qty + '</span>' +
        '<button class="stepper-btn" data-action="add-qty-delta" data-delta="1">＋</button></div>'
      : gaugeSelectorHtml("add-set-gauge", f.gauge);

    return '' +
      '<div class="sheet-backdrop" data-action="close-add"></div>' +
      '<div class="sheet">' +
        '<div class="sheet-head"><span>追加</span><button class="sheet-close" data-action="close-add">×</button></div>' +
        '<div class="sheet-body">' +
          '<div class="favorites-header">' +
            '<div class="sheet-label">よく買うもの</div>' +
            '<button class="favorites-edit-toggle" data-action="toggle-favorites-edit">' + (editMode ? "完了" : "編集") + '</button>' +
          '</div>' +
          '<div class="preset-grid">' + presetGrid + '</div>' +
          '<div class="sheet-divider">または自由に入力</div>' +
          '<input class="field" type="text" placeholder="名前" data-field="add-name" value="' + esc(f.name) + '">' +
          '<div class="sheet-label">絵文字</div>' +
          '<input class="field emoji-input" type="text" placeholder="絵文字を入力 または下から選択" data-field="add-emoji-custom" value="' + esc(f.emoji) + '">' +
          renderEmojiGroupsHtml(f.emoji, "add-set-emoji") +
          '<div class="sheet-label">タイプ</div>' +
          '<div class="segmented">' +
            '<button class="seg-btn' + (f.type === "count" ? ' active' : '') + '" data-action="add-set-type" data-type="count">個数</button>' +
            '<button class="seg-btn' + (f.type === "gauge" ? ' active' : '') + '" data-action="add-set-type" data-type="gauge">残量</button>' +
          '</div>' +
          qtyOrGauge +
          deptField +
          '<label class="fav-checkbox-row">' +
            '<input type="checkbox" data-field="add-fav-checkbox"' + (f.registerFavorite ? ' checked' : '') + '>' +
            '<span>⭐ よく買うものに登録</span>' +
          '</label>' +
        '</div>' +
        '<div class="sheet-actions">' +
          '<button class="btn-outline" data-action="close-add">キャンセル</button>' +
          '<button class="btn-primary" data-action="add-submit">追加</button>' +
        '</div>' +
      '</div>';
  }

  function renderEditSheet(){
    var f = S.editForm;
    var cat = f.cat;
    var catOptions = ["fridge", "daily", "pet"].map(function(c){
      return '<option value="' + c + '"' + (cat === c ? ' selected' : '') + '>' + esc(CAT_LABELS[c]) + '</option>';
    }).join('');
    var deptField = "";
    if (cat !== "pet") {
      var deptOptions = DEPTS[cat].map(function(d){
        return '<option value="' + esc(d) + '"' + (f.dept === d ? ' selected' : '') + '>' + esc(d) + '</option>';
      }).join('');
      deptField = '<div class="sheet-label">部門</div><select class="field" data-field="edit-dept">' + deptOptions + '</select>';
    }
    var qtyOrGauge = f.type === "count"
      ? '<div class="stepper"><button class="stepper-btn" data-action="edit-qty-delta" data-delta="-1">−</button>' +
        '<span class="stepper-val">' + f.qty + '</span>' +
        '<button class="stepper-btn" data-action="edit-qty-delta" data-delta="1">＋</button></div>'
      : gaugeSelectorHtml("edit-set-gauge", f.gauge);

    return '' +
      '<div class="sheet-backdrop" data-action="close-edit"></div>' +
      '<div class="sheet">' +
        '<div class="sheet-head"><span>編集</span><button class="sheet-close" data-action="close-edit">×</button></div>' +
        '<div class="sheet-body">' +
          '<input class="field" type="text" placeholder="名前" data-field="edit-name" value="' + esc(f.name) + '">' +
          '<div class="sheet-label">絵文字</div>' +
          '<input class="field emoji-input" type="text" placeholder="絵文字" data-field="edit-emoji-custom" value="' + esc(f.emoji) + '">' +
          renderEmojiGroupsHtml(f.emoji, "edit-set-emoji") +
          '<div class="sheet-label">タイプ</div>' +
          '<div class="segmented">' +
            '<button class="seg-btn' + (f.type === "count" ? ' active' : '') + '" data-action="edit-set-type" data-type="count">個数</button>' +
            '<button class="seg-btn' + (f.type === "gauge" ? ' active' : '') + '" data-action="edit-set-type" data-type="gauge">残量</button>' +
          '</div>' +
          qtyOrGauge +
          '<div class="sheet-label">カテゴリ</div>' +
          '<select class="field" data-field="edit-cat">' + catOptions + '</select>' +
          deptField +
        '</div>' +
        '<div class="sheet-actions">' +
          '<button class="delete-link" data-action="edit-delete">削除</button>' +
          '<button class="btn-primary" data-action="edit-save">保存</button>' +
        '</div>' +
      '</div>';
  }

  // ─────────────────────────────────────────
  // 全体描画
  // ─────────────────────────────────────────
  function render(){
    var app = document.getElementById("app");
    if (!S.data) { app.innerHTML = ""; return; }

    // 全再描画方式だとシート(.sheet)が毎回作り直され、scrollTopが0にリセットされてしまう。
    // 描画前にシート/ページのスクロール位置を保存し、描画後に復元して「勝手に上へ戻る」のを防ぐ。
    var prevSheet = app.querySelector(".sheet");
    var savedSheetScrollTop = prevSheet ? prevSheet.scrollTop : 0;
    var savedPageScrollTop = window.pageYOffset || document.documentElement.scrollTop || document.body.scrollTop || 0;

    var body;
    if (S.tab === "fridge") body = renderStockTab("fridge");
    else if (S.tab === "daily") body = renderStockTab("daily");
    else if (S.tab === "pet") body = renderStockTab("pet");
    else body = renderShoppingTab();

    app.innerHTML =
      renderHeader() +
      body +
      renderTabBar() +
      renderToast() +
      (S.addOpen && S.addForm ? renderAddSheet() : '') +
      (S.editingId && S.editForm ? renderEditSheet() : '');

    var newSheet = app.querySelector(".sheet");
    if (newSheet) newSheet.scrollTop = savedSheetScrollTop;
    if (savedPageScrollTop) window.scrollTo(0, savedPageScrollTop);
  }

  // ─────────────────────────────────────────
  // イベント委譲
  // ─────────────────────────────────────────
  // テキスト入力: フォーカスを失わないようここではrender()を呼ばない
  function handleInput(e){
    var el = e.target;
    var field = el.dataset.field;
    if (!field) return;
    switch (field) {
      case "add-name": S.addForm.name = el.value; S.addForm.nameAuto = false; break;
      case "add-emoji-custom": S.addForm.emoji = el.value; break;
      case "edit-name": S.editForm.name = el.value; break;
      case "edit-emoji-custom": S.editForm.emoji = el.value; break;
      case "shopping-input": S.shoppingInput = el.value; break;
    }
  }

  // select要素の変更: 選択確定後なのでrender()して問題ない
  function handleChange(e){
    var el = e.target;
    var field = el.dataset.field;
    if (!field) return;
    switch (field) {
      case "add-dept": S.addForm.dept = el.value; render(); break;
      case "edit-dept": S.editForm.dept = el.value; render(); break;
      case "add-fav-checkbox": S.addForm.registerFavorite = !!el.checked; break;
      case "edit-cat": {
        var newCat = el.value;
        S.editForm.cat = newCat;
        S.editForm.dept = newCat === "pet" ? null : DEPTS[newCat][0];
        render();
        break;
      }
    }
  }

  // 名前入力欄からフォーカスが外れたら学習辞書/食材辞書からサジェストを反映する
  function handleFocusOut(e){
    var el = e.target;
    var field = el.dataset && el.dataset.field;
    if (field === "add-name") { trySuggest(S.addForm, S.addForm.name); render(); }
    else if (field === "edit-name") { trySuggest(S.editForm, S.editForm.name); render(); }
  }

  function handleKeydown(e){
    var el = e.target;
    if (el && el.dataset && el.dataset.field === "shopping-input" && e.key === "Enter") {
      e.preventDefault();
      addShoppingManual();
    }
  }

  function handleClick(e){
    var el = e.target.closest("[data-action]");
    if (!el) return;
    var action = el.dataset.action;
    switch (action) {
      case "set-tab":
        S.tab = el.dataset.tab; S.addOpen = false; S.editingId = null; render(); break;
      case "open-add": openAddSheet(); break;
      case "close-add": closeAddSheet(); break;
      case "close-edit": closeEditSheet(); break;
      case "edit-item": openEditSheet(el.dataset.id); break;
      case "consume-item": consumeItem(el.dataset.id); break;
      case "gauge-tap": tapGauge(el.dataset.id); break;
      case "add-preset": {
        var pname = el.dataset.name;
        var preset = null;
        var list = S.data.favorites[S.addForm.cat] || [];
        for (var i = 0; i < list.length; i++){ if (list[i].name === pname) { preset = list[i]; break; } }
        if (preset) addPreset(S.addForm.cat, preset);
        break;
      }
      case "toggle-favorites-edit": S.favoritesEditMode = !S.favoritesEditMode; render(); break;
      case "favorite-delete": deleteFavorite(el.dataset.cat, el.dataset.name); break;
      case "add-set-emoji": {
        var af = S.addForm;
        var newEmoji = el.dataset.emoji;
        var currentName = (af.name || "").trim();
        var isEmpty = currentName === "";
        var isStaleAuto = af.nameAuto && currentName === af.autoNameValue;
        if (isEmpty || isStaleAuto) {
          var repName = EMOJI_TO_NAME[newEmoji];
          if (repName) {
            af.name = repName;
            af.nameAuto = true;
            af.autoNameValue = repName;
            trySuggest(af, repName);
          }
        }
        af.emoji = newEmoji;
        render();
        break;
      }
      case "edit-set-emoji": S.editForm.emoji = el.dataset.emoji; render(); break;
      case "add-set-type": S.addForm.type = el.dataset.type; render(); break;
      case "edit-set-type": S.editForm.type = el.dataset.type; render(); break;
      case "add-qty-delta":
        S.addForm.qty = Math.max(1, (S.addForm.qty || 1) + Number(el.dataset.delta)); render(); break;
      case "edit-qty-delta":
        S.editForm.qty = Math.max(1, (S.editForm.qty || 1) + Number(el.dataset.delta)); render(); break;
      case "add-set-gauge": S.addForm.gauge = Number(el.dataset.g); render(); break;
      case "edit-set-gauge": S.editForm.gauge = Number(el.dataset.g); render(); break;
      case "add-submit": submitAddForm(); break;
      case "edit-save": saveEditItem(); break;
      case "edit-delete": deleteItem(S.editingId); break;
      case "shopping-add": addShoppingManual(); break;
      case "shopping-toggle": toggleShoppingChecked(el.dataset.id); break;
      case "shopping-delete": deleteShoppingItem(el.dataset.id); break;
      case "shopping-clear-checked": clearCheckedShopping(); break;
      case "shopping-move-to-stock": moveCheckedToStock(); break;
      case "toast-undo": doUndo(); break;
      case "toast-add-shopping": {
        if (S.toast && S.toast.data) {
          var d = S.toast.data;
          addToShoppingIfNotExists(d.name, d.emoji, d.cat, d.dept);
        }
        hideToast();
        showToast("メモしたぞう", [], 2000);
        break;
      }
    }
  }

  function init(){
    var app = document.getElementById("app");
    app.addEventListener("click", handleClick);
    app.addEventListener("input", handleInput);
    app.addEventListener("change", handleChange);
    app.addEventListener("focusout", handleFocusOut);
    app.addEventListener("keydown", handleKeydown);

    S.data = loadData();
    render();
  }

  init();
})();
</script>
<script>
// Service Worker登録(PWA・オフライン対応)。パスは相対必須(GitHub Pagesのサブディレクトリ配下対応)
if ("serviceWorker" in navigator) {
  window.addEventListener("load", function(){
    navigator.serviceWorker.register("./sw.js").catch(function(){ /* 登録失敗でもアプリは動く */ });
  });
}
</script>
</body>
